# Resting-exit fill probe (python/exitfill; Steven, Nov 12 2026): would a resting sell have filled where the heat lane
# sells with a reduce-only IOC? Research only: public heat-shadow capture books (already uploaded artifacts) joined to
# a list of paper exits; one commit comment with aggregates. No Drive, no server, no recordings, no secrets, no deploy.
#
# A push of these files runs the unit tests only. The study runs only when the pushed commit changes
# python/exitfill/RUN, and the guard refuses a RUN without the read-log row id (the row is written BEFORE that push).
# Never merged to main; a new workflow file runs from its own branch on push.
name: Heat exit-fill probe

on:
  push:
    branches: [claude/project-thread-eqduzm]
    paths: ['.github/workflows/heat-exit-fill.yml', 'python/exitfill/**']

permissions:
  contents: read

# Each push has its own group, so a quick follow-up push can never replace a queued study. Not the capture's group.
concurrency:
  group: heat-exit-fill-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      study: ${{ steps.go.outputs.study }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - name: Unit tests (synthetic books only)
        run: cd python && python -W ignore -m unittest discover -s exitfill/tests -t .
      - id: go
        name: Did this push change RUN?
        run: |
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -qx 'python/exitfill/RUN' && [ -f python/exitfill/RUN ]; then
            echo "study=true" >> "$GITHUB_OUTPUT"
          else
            echo "study=false" >> "$GITHUB_OUTPUT"
          fi

  study:
    needs: test
    if: needs.test.outputs.study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # only to post the card as a commit comment
      actions: read     # to read the capture runs' artifacts
    env:
      GH_TOKEN: ${{ github.token }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -q numpy
      - name: Guard (floor, window, DOGE, artifact names, read-log id) before any download
        run: cd python && python -m exitfill.guard exitfill/RUN
      - name: Fetch the named capture segments (public data, books and markets are opened later; nothing else is read)
        run: |
          set -euo pipefail
          names=$(sed -nE 's/^artifacts=([A-Za-z0-9,-]+)$/\1/p' python/exitfill/RUN | tail -1)
          IFS=, read -ra NAMES <<< "$names"
          for n in "${NAMES[@]}"; do
            run_id=$(echo "$n" | sed -E 's/^heat-shadow-([0-9]+)-.*$/\1/')
            ok=0
            for attempt in 1 2 3 4 5 6; do
              for cand in "$n" "$n-try2" "$n-try3"; do
                if gh run download "$run_id" -n "$cand" --repo "$GITHUB_REPOSITORY" --dir "$RUNNER_TEMP/capture/$n" 2>/dev/null; then ok=1; break; fi
              done
              [ "$ok" = 1 ] && break
              sleep 30
            done
            [ "$ok" = 1 ] || { echo "::error::artifact $n could not be downloaded"; exit 1; }
          done
          echo "segments: ${#NAMES[@]}"
      - name: Replay the exits against the books
        run: cd python && python -m exitfill.run --capture "$RUNNER_TEMP/capture" --out "$RUNNER_TEMP/card.md" > "$RUNNER_TEMP/run.log"; tail -n 3 "$RUNNER_TEMP/run.log" | cut -c1-300; head -n 1 "$RUNNER_TEMP/run.log" | cut -c1-400
      - name: Card to the step summary and one commit comment (aggregates only)
        run: |
          set -euo pipefail
          cat "$RUNNER_TEMP/card.md" >> "$GITHUB_STEP_SUMMARY"
          python3 -c 'import json,sys; b=open(sys.argv[1]).read()[:60000]+"\n\n---\n_Generated by [Claude Code](https://claude.ai/code)_"; print(json.dumps({"body": b}))' "$RUNNER_TEMP/card.md" > "$RUNNER_TEMP/c.json"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input "$RUNNER_TEMP/c.json" --jq '.html_url'
