name: Tennis TA sweep

# The tennis TA rulebook trial's sweeps (research/tennisTaSweep.ts, research/tennisTaSim.ts, research/tennisTaSignals.ts,
# research/tennis_ta_report.py; pre-registration and amendments in the thread "Build a profitable tennis TA rulebook",
# Nov 5 2026; request format in research/tennis-ta/README.md). Each run is asked for by a commit to
# research/tennis-ta/sweep-request.json (stage, pool, date range, shards, familyB), so every counting run is a deliberate,
# logged commit. prep validates the request (HO-1, C9 / C10: pool 'disc' = H-DEV at stages 1 and 2, 'old' = H0 at stage 2,
# 'hold' = H-HOLD at stage hold only: the one read of Amendment 4, whose batch research/tennis-ta/hold-batch.json (the 10
# hottest hot spots of the league, listed in the registry and the project calendar before the push) is refused when the
# file's sha256 is already in the openings ledger models/tennis-ta/state/openings.jsonl on Drive) and cuts the pool's units into shards
# and each shard into 4 sub-slices, at unit edges only (a unit is never split, so cross-match state restarts only at
# unit edges). Shards replay the Kalshi tennis history kept on Drive
# (raw/tennis-history/kalshi, its sha256 recorded as the data version) through the production tennis strategy over the
# stage's configs; a shard first checks that the history is complete over its span (the download's complete-listing
# record and every traded market's tape) and fails before sweeping if not. The report job runs only when every shard
# leg succeeded, every planned shard file is on Drive exactly once with one data version, every slice's history is
# complete and every file's window block is whole (C12); a hold run's opening is then appended to the openings ledger
# (once per run id) before anything is scored, so a broken block never spends a batch's one read; it
# scores every cell over the pool's universe, runs the one test's league on a disc run (league.md, league.csv,
# league.json beside the report), writes the run's trial rows (registry v1, validated with the project's
# research/registry.py) and uploads them once to the registry (registry/shards/tennis-ta/<run>.jsonl).
# Outputs stay on Drive (models/tennis-ta/runs/<run>/); the report is posted once as a comment on the commit. A run id
# that has been scored (its registry rows are in runs/<run>/report) is never overwritten: "Re-run all jobs" on it fails
# in prep, a shard job re-run on its own fails before sweeping, and a re-run report job keeps the Drive copy (refusing if
# its rows differ). A new measurement is a new commit of the request.
on:
  push:
    branches: [claude/project-thread-7817be]
    paths: [research/tennis-ta/sweep-request.json]

permissions:
  contents: write

concurrency:
  group: tennis-ta-sweep
  cancel-in-progress: false

jobs:
  prep:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      plan: ${{ steps.req.outputs.plan }}
      shards: ${{ steps.req.outputs.shards }}
      stage: ${{ steps.req.outputs.stage }}
      pool: ${{ steps.req.outputs.pool }}
      family_b: ${{ steps.req.outputs.family_b }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: tennis-ta-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent --ignore-scripts
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Openings ledger (the batches already read on H-HOLD)
        run: |
          set -euo pipefail
          # C10 / Amendment 4: prep refuses a stage hold request whose batch (sha256 of research/tennis-ta/hold-batch.json)
          # is in the ledger.
          # Each level is listed only when its parent lists it, so a listing error fails the step; a ledger that does not
          # exist yet reads as empty, and any other read error fails.
          mkdir -p prep
          LEDGER=gdrive:kalshi-bot-archive/models/tennis-ta/state/openings.jsonl
          HAVE=yes; P=gdrive:kalshi-bot-archive
          for c in models/ tennis-ta/ state/; do
            L=$(rclone lsf "$P" --dirs-only)
            if ! grep -qxF "$c" <<< "$L"; then HAVE=no; break; fi
            P="$P/${c%/}"
          done
          if [ "$HAVE" = yes ]; then L=$(rclone lsf "$P" --files-only); grep -qxF openings.jsonl <<< "$L" || HAVE=no; fi
          if [ "$HAVE" = yes ]; then rclone cat "$LEDGER" > prep/openings.jsonl; else : > prep/openings.jsonl; fi
          echo "openings ledger: $(grep -c . prep/openings.jsonl || true) row(s)$([ "$HAVE" = yes ] || echo ' (none on Drive yet)')"
      - name: Request and plan
        id: req
        run: |
          set -euo pipefail
          mkdir -p prep
          cat research/tennis-ta/sweep-request.json
          # Validates the request (stage 1, 2 or hold; pool 'disc', 'old' at stage 2 or 'hold' at stage hold; [from, to]
          # covering the start of every pool unit it touches, the whole hold block for hold; the stage's spec file, or at
          # stage hold the batch research/tennis-ta/hold-batch.json, whose file hash is not yet in the openings ledger) and
          # the unit table (calendar, Slams), then plans shards and sub-slices at unit edges.
          node --import tsx research/tennisTaSweep.ts prep --request research/tennis-ta/sweep-request.json \
            --units models/tennis-ta/state/units.json --openings prep/openings.jsonl --out prep/plan.json
          echo "plan=$(jq -c '.plan' prep/plan.json)" >> "$GITHUB_OUTPUT"
          echo "shards=$(jq -r '.plan | length' prep/plan.json)" >> "$GITHUB_OUTPUT"
          echo "stage=$(jq -r '.stage' prep/plan.json)" >> "$GITHUB_OUTPUT"
          echo "pool=$(jq -r '.pool' prep/plan.json)" >> "$GITHUB_OUTPUT"
          echo "family_b=$(jq -r '.familyB' prep/plan.json)" >> "$GITHUB_OUTPUT"
          jq -r '.plan[] | "shard \(.k): \(.from) to \(.to), \(.units | length) unit(s): \(.units | join(" "))"' prep/plan.json
          jq -r 'if .stage == "hold" then "stage hold: batch \(.batchHash) off league run \(.leagueRun) (\(.batch | length) hot spot(s): " + ([.batch[] | "\(.id)/\(.leg)"] | join(", ")) + "; \(.specIds | length) arms), not in the openings ledger (\(.openingsRead) row(s) read); folds " + ([.holdFolds[] | "\(.fold) \(.from)..\(.to)"] | join(", ")) else "specs \(.specsHash[0:16]) (\(.configs))" end' prep/plan.json
      - name: Run id not already scored
        run: |
          set -euo pipefail
          # Scored = runs/<run>/report holds this run's registry rows (registry-v1-<run>.jsonl; the older
          # registry-tennis-ta-<run>.jsonl.gz counts too). Each level is listed only when its parent lists it, so a listing
          # error fails the step instead of reading as "not scored". "Re-run all jobs" keeps the run id but fetches fees
          # and history again, so on a scored run it would overwrite the shards and the report the registry rows and the
          # commit comment came from.
          SCORED=yes; P=gdrive:kalshi-bot-archive
          for c in models/ tennis-ta/ runs/ "$GITHUB_RUN_ID/" report/; do
            L=$(rclone lsf "$P" --dirs-only)
            if ! grep -qxF "$c" <<< "$L"; then SCORED=no; break; fi
            P="$P/${c%/}"
          done
          if [ "$SCORED" = yes ]; then L=$(rclone lsf "$P" --files-only); grep -qxE "registry-v1-$GITHUB_RUN_ID\.jsonl|registry-tennis-ta-$GITHUB_RUN_ID\.jsonl\.gz" <<< "$L" || SCORED=no; fi
          if [ "$SCORED" = yes ]; then
            echo "::error::run $GITHUB_RUN_ID is already scored (attempt $GITHUB_RUN_ATTEMPT is a re-run): its report and registry rows stand. Commit a new request for a new run"; exit 1
          fi
          echo "run $GITHUB_RUN_ID (attempt $GITHUB_RUN_ATTEMPT) has no scored report yet"
      - name: Fee changes (Kalshi)
        run: |
          set -euo pipefail
          node --import tsx research/tennisTaSweep.ts fees --series KXATPMATCH,KXWTAMATCH --out prep/fees.json
      - uses: actions/upload-artifact@v4
        with:
          name: prep
          path: |
            prep/fees.json
            prep/plan.json
          retention-days: 30

  shard:
    name: shard ${{ matrix.k }} (${{ matrix.from }} to ${{ matrix.to }})
    needs: prep
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        include: ${{ fromJSON(needs.prep.outputs.plan) }}
    env:
      K: ${{ matrix.k }}
      FROM: ${{ matrix.from }}
      TO: ${{ matrix.to }}
      UNITS: ${{ join(matrix.units, ',') }}
      SHARDS: ${{ needs.prep.outputs.shards }}
      STAGE: ${{ needs.prep.outputs.stage }}
      POOL: ${{ needs.prep.outputs.pool }}
      FAMILY_B: ${{ needs.prep.outputs.family_b }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      # Family B reads TA-Lib through the vendored native binding (vendor/talib, compiled by its install script), so the
      # shard installs WITH scripts and caches the compiled build beside node_modules (the prep job needs no TA-Lib).
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: tennis-ta-shard-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: TA-Lib engine (family B refuses to run without it)
        if: env.FAMILY_B == 'true'
        run: |
          node --import tsx -e "import('./bot/ta/talib.ts').then((m) => { if (m.taEngine() !== 'talib') { console.error('TA-Lib engine not loaded: ' + m.taEngineError()); process.exit(1); } console.log('TA-Lib engine: talib'); })"
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Run id not already scored
        run: |
          set -euo pipefail
          # A shard job re-run on its own after the report (prep's check does not run again then) would overwrite the
          # shards the registry rows came from. Same test as prep's: runs/<run>/report holds this run's registry rows.
          SCORED=yes; P=gdrive:kalshi-bot-archive
          for c in models/ tennis-ta/ runs/ "$GITHUB_RUN_ID/" report/; do
            L=$(rclone lsf "$P" --dirs-only)
            if ! grep -qxF "$c" <<< "$L"; then SCORED=no; break; fi
            P="$P/${c%/}"
          done
          if [ "$SCORED" = yes ]; then L=$(rclone lsf "$P" --files-only); grep -qxE "registry-v1-$GITHUB_RUN_ID\.jsonl|registry-tennis-ta-$GITHUB_RUN_ID\.jsonl\.gz" <<< "$L" || SCORED=no; fi
          if [ "$SCORED" = yes ]; then echo "::error::run $GITHUB_RUN_ID is already scored: its shards on Drive stand and are not swept again"; exit 1; fi
      - name: Tennis history from Drive (sha256 of each tarball = the data version)
        run: |
          set -euo pipefail
          mkdir -p data/tennis/kalshi
          DV=""
          for S in KXATPMATCH KXWTAMATCH; do
            if [ -z "$(rclone lsf gdrive:kalshi-bot-archive/raw/tennis-history/kalshi --files-only --include "$S.tar.gz")" ]; then
              echo "::error::no $S history on Drive"; exit 1
            fi
            rclone copy "gdrive:kalshi-bot-archive/raw/tennis-history/kalshi/$S.tar.gz" .
            H=$(sha256sum "$S.tar.gz" | cut -d' ' -f1)
            DV="${DV:+$DV,}$S:sha256:$H"
            tar -xzf "$S.tar.gz" -C data/tennis/kalshi && rm "$S.tar.gz"
            echo "$S: sha256 $H, $(ls data/tennis/kalshi/$S | grep -c jsonl) day file(s)"
          done
          echo "DATA_VERSION=$DV" >> "$GITHUB_ENV"
      - name: History complete over the shard (download listing and trade tapes)
        run: |
          set -euo pipefail
          # Fails when the history's complete-listing record (<S>/.index.json "listed", written only by a download run
          # that listed and stored every settled market) does not cover the closes the shard reads, or a traded market
          # closing then has no tape: an unfinished download is never swept or scored (the report job checks it again).
          node --import tsx research/tennisTaSweep.ts coverage --hist data/tennis/kalshi --from "$FROM" --to "$TO" --series KXATPMATCH,KXWTAMATCH
      - name: Replay days for the slice
        run: |
          set -euo pipefail
          # This job sweeps history (H). The sim reads market lines from 1 day before a slice on H (lookbackOf('H'):
          # history lists a match 30 min before its start; LOOKBACK_DAYS = 7 is the recorded stratum's) and reads on to
          # the end of the slice's last day, so late matches finish within CLOSE_TAIL_DAYS = 2: replay days cover both.
          A=$(date -u -d "$FROM -1 day" +%F); B=$(date -u -d "$TO +2 day" +%F)
          node --max-old-space-size=6144 --import tsx research/tennisTaSweep.ts days --hist data/tennis/kalshi --out data/replay --from "$A" --to "$B" --series KXATPMATCH,KXWTAMATCH 2>&1 | tail -5
      - name: Sweep (4 processes on the runner's 4 cores, sub-slices cut at unit edges)
        run: |
          set -euo pipefail
          mkdir -p out
          # The same cut prep made (prep/plan.json subPlans); the report job checks every file against it.
          SUB=$(node --import tsx research/tennisTaSweep.ts subplan --units models/tennis-ta/state/units.json --units-list "$UNITS" --parts 4)
          echo "$SUB" | jq -r '.[] | "sub-slice \(.k): \(.from) to \(.to): \(.units | join(" "))"'
          NSUB=$(echo "$SUB" | jq length)
          pids=()
          for j in $(echo "$SUB" | jq -r '.[].k'); do
            F=$(echo "$SUB" | jq -r ".[$j].from"); T=$(echo "$SUB" | jq -r ".[$j].to"); U=$(echo "$SUB" | jq -r ".[$j].units | join(\",\")")
            node --max-old-space-size=3584 --import tsx research/tennisTaSweep.ts run --replay data/replay --hist data/tennis/kalshi \
              --from "$F" --to "$T" --units-list "$U" --stage "$STAGE" --pool "$POOL" --family-b "$FAMILY_B" \
              --units models/tennis-ta/state/units.json --fees prep/fees.json --request research/tennis-ta/sweep-request.json \
              --data-version "$DATA_VERSION" --run "$GITHUB_RUN_ID" --k "$K" --j "$j" --shards "$SHARDS" --sub-shards "$NSUB" \
              --out "out/a-s$STAGE-$K-$j.json.gz" > "out/log-$j.txt" 2>&1 &
            pids+=($!)
          done
          rc=0; for p in "${pids[@]}"; do wait "$p" || rc=1; done
          # A failed sub-slice shows its error (the message sits above the stack, so 3 lines would show only the stack).
          for f in out/log-*.txt; do echo "==> $f <=="; if [ "$rc" != 0 ]; then grep -v '^\[tennis-ta\]' "$f" | head -n 40 || true; fi; tail -n 3 "$f"; done
          exit $rc
      - name: Keep on Drive
        run: |
          set -euo pipefail
          for f in out/a-s*.json.gz; do rclone copyto "$f" "gdrive:kalshi-bot-archive/models/tennis-ta/runs/$GITHUB_RUN_ID/shards/$(basename "$f")"; done
          du -ch out/a-s*.json.gz | tail -1

  report:
    needs: [prep, shard]
    # Only a complete run is scored: every shard leg succeeded (a re-run of failed legs re-runs this job too).
    if: ${{ !cancelled() && needs.prep.result == 'success' && needs.shard.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      POOL: ${{ needs.prep.outputs.pool }}
      STAGE: ${{ needs.prep.outputs.stage }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies
        id: deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: tennis-ta-deps-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent --ignore-scripts
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Python packages
        run: pip install --quiet numpy scipy scikit-learn
      - uses: actions/download-artifact@v4
        with:
          name: prep
          path: prep
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Registry module (research/registry.py from main, else from the registry thread's branch)
        run: |
          set -euo pipefail
          # The project's trial registry (row schema, make_id, validate) is another thread's code: it is read from main
          # when it has landed there, else from that thread's branch, and never from this branch.
          git fetch --no-tags --depth 1 origin +refs/heads/main:refs/remotes/origin/main
          SRC=origin/main
          if ! git cat-file -e "$SRC:research/registry.py" 2>/dev/null; then
            SRC=origin/claude/project-thread-79ntof
            git fetch --no-tags --depth 1 origin "+refs/heads/claude/project-thread-79ntof:refs/remotes/$SRC"
            git cat-file -e "$SRC:research/registry.py" || { echo "::error::research/registry.py is on neither main nor claude/project-thread-79ntof"; exit 1; }
          fi
          git show "$SRC:research/registry.py" > /tmp/registry.py
          python3 -I /tmp/registry.py schema > /dev/null
          echo "registry.py from $SRC $(git rev-parse --short "$SRC"), sha256 $(sha256sum /tmp/registry.py | cut -c1-16)"
      - name: Shards (every planned file on Drive exactly once, one run, one request, one data version, history complete, window block whole)
        run: |
          set -euo pipefail
          D="gdrive:kalshi-bot-archive/models/tennis-ta/runs/$GITHUB_RUN_ID/shards"
          rclone lsf "$D" --files-only > listed.txt
          rclone copy "$D" shards
          echo "$(wc -l < listed.txt) file(s) listed on Drive, $(ls shards | wc -l) copied"
          mkdir -p report
          # The completeness check: exits 1 (failing the job before anything is scored or uploaded) on any problem, and
          # writes its summary with the problem list to report/shards-check.json either way. It reads every file's
          # window block too (C12: the plan's window arms x legs, the matchList's events, the row shapes, meta's counts;
          # at stage hold every batch member's |window rows), so a hold run with a broken or incomplete block fails
          # HERE, before the ledger step below spends the batch's one read (the report's own read_shard gate would
          # otherwise be the first to see it, after the append).
          node --import tsx research/tennisTaSweep.ts check --dir shards --listing listed.txt --prep prep/plan.json --run "$GITHUB_RUN_ID" --out report/shards-check.json
      - name: Openings ledger (stage hold, once the shard set is complete and before anything is scored)
        run: |
          set -euo pipefail
          # C10 / Amendment 4 item 7: H-HOLD is read once per batch (research/tennis-ta/hold-batch.json, keyed by the
          # file's sha256, prep's batchHash). The opening is recorded here, after the completeness check (the window block
          # included) passed and before the report reads a number, so every hold run that is scored at all is in the
          # ledger. The row is {hash, run,
          # ts, ids, pool: "hold"} (ids = the arms run: each batch config's |window and |F1); a re-run of this job keeps the
          # run's row (idempotent by run id) and fails if the ledger holds this batch under another run, or this run with
          # another batch.
          if [ "$STAGE" != hold ]; then echo "stage $STAGE: not a hold run, no opening to record"; exit 0; fi
          RUN="$GITHUB_RUN_ID"
          H=$(jq -r '.batchHash // ""' prep/plan.json)
          if ! [[ "$H" =~ ^[0-9a-f]{64}$ ]]; then echo "::error::prep/plan.json carries no batch hash (batchHash): nothing is scored"; exit 1; fi
          LEDGER=gdrive:kalshi-bot-archive/models/tennis-ta/state/openings.jsonl
          HAVE=yes; P=gdrive:kalshi-bot-archive
          for c in models/ tennis-ta/ state/; do
            L=$(rclone lsf "$P" --dirs-only)
            if ! grep -qxF "$c" <<< "$L"; then HAVE=no; break; fi
            P="$P/${c%/}"
          done
          if [ "$HAVE" = yes ]; then L=$(rclone lsf "$P" --files-only); grep -qxF openings.jsonl <<< "$L" || HAVE=no; fi
          if [ "$HAVE" = yes ]; then rclone cat "$LEDGER" > openings.jsonl; else : > openings.jsonl; fi
          # A damaged ledger fails here and is never overwritten.
          jq -s -e 'all(.[]; type == "object" and (.hash | type) == "string")' openings.jsonl > /dev/null \
            || { echo "::error::$LEDGER is not JSON lines of {hash, ...}: not overwritten, nothing is scored"; exit 1; }
          OTHER=$(jq -s -r --arg r "$RUN" --arg h "$H" '[.[] | select(.hash == $h and (.run | tostring) != $r) | .run | tostring] | first // ""' openings.jsonl)
          if [ -n "$OTHER" ]; then echo "::error::batch $H was already opened on H-HOLD by run $OTHER: the one read is one run per batch, nothing is scored"; exit 1; fi
          MINE=$(jq -s -r --arg r "$RUN" '[.[] | select((.run | tostring) == $r) | .hash] | unique | join(",")' openings.jsonl)
          if [ "$MINE" = "$H" ]; then echo "run $RUN's opening of $H is already in the ledger (a re-run of this job): kept"; exit 0; fi
          if [ -n "$MINE" ]; then echo "::error::the ledger holds run $RUN with another batch ($MINE): nothing is scored"; exit 1; fi
          if [ -s openings.jsonl ] && [ -n "$(tail -c 1 openings.jsonl)" ]; then echo >> openings.jsonl; fi
          jq -nc --arg h "$H" --arg r "$RUN" --arg ts "$(date -u +%FT%TZ)" --slurpfile p prep/plan.json \
            '{hash: $h, run: $r, ts: $ts, ids: $p[0].specIds, pool: "hold"}' >> openings.jsonl
          rclone copyto openings.jsonl "$LEDGER"
          rclone cat "$LEDGER" | jq -s -e --arg r "$RUN" --arg h "$H" '[.[] | select((.run | tostring) == $r and .hash == $h)] | length == 1' > /dev/null \
            || { echo "::error::the opening did not land in $LEDGER: nothing is scored"; exit 1; }
          echo "recorded the opening of batch $H (run $RUN, $(jq '.batch | length' prep/plan.json) hot spot(s), $(jq '.specIds | length' prep/plan.json) arm(s)) in $LEDGER"
      - name: Report
        run: |
          set -euo pipefail
          python research/tennis_ta_report.py --shards shards --pool "$POOL" --run "$GITHUB_RUN_ID" --out report --plan prep/plan.json \
            --registry-py /tmp/registry.py --sha "$GITHUB_SHA" | tail -60
          cp prep/plan.json report/plan.json
          # The one test's league (Amendment 4 item 7) runs on H-DEV only: a disc run's report writes league.md, league.csv
          # and league.json beside the report, and they go to Drive with it (the next steps copy the report directory).
          if [ "$POOL" = disc ]; then
            for f in league.md league.csv league.json; do [ -s "report/$f" ] || { echo "::error::the report wrote no report/$f (the one test's league of a disc run): nothing is kept or uploaded"; exit 1; }; done
            echo "league: $(wc -l < report/league.csv) line(s) in report/league.csv, report/league.md, report/league.json"
          fi
          # Run mechanics, stated with every report.
          jq -r '"## Run mechanics\n\(.shards) shard(s) x up to 4 sub-slices = \(.subSlices) slice(s) over \(.units) unit(s), cut at unit edges only: cross-match state (tennis-only pacer, 25% / 10% caps, coin-placebo stream, family B placebo reservoir) restarts only at unit edges. Families \(.families | join("+")). Data version \(.dataVersion). \(.matches) owned matches, \(.noPublishedStart) without a published start (unit and pool from the earliest market-line time); by pool: " + ([(.pools // {}) | to_entries[] | "\(.key) \(.value.matches) in \(.value.units) unit(s)"] | join(", ")) + " (nostart = start-era matches without a published start: excluded and counted). " + ([.series | to_entries[] | "\(.key): history \(.value.first // "-") to \(.value.last // "-"), \(.value.spanDays - (.value.missing | length)) of \(.value.spanDays) swept days with a file (the download listed every close from \(.value.listed.from // "?" | .[0:10]) to \(.value.listed.to // "?" | .[0:10]) completely, so a day without one had no market closing), \(.value.tapesMissing // 0) traded market(s) without a tape"] | join("; ")) + "."' report/shards-check.json > report/run-mechanics.md
          cat report/run-mechanics.md
      - name: Registry rows valid (research/registry.py validate, contract type tennis)
        run: |
          set -euo pipefail
          ROWS="report/registry-v1-$GITHUB_RUN_ID.jsonl"
          if [ ! -s "$ROWS" ]; then echo "::error::the report wrote no registry rows ($ROWS): nothing is kept or uploaded"; exit 1; fi
          rc=0; python3 -I /tmp/registry.py validate "$ROWS" > validate.txt || rc=$?
          echo "$(grep -c . "$ROWS") row(s): $(grep -c ': INVALID ' validate.txt || true) invalid, $(grep -c ': flags ' validate.txt || true) with validator flags"
          grep ': INVALID ' validate.txt | head -n 20 | sed 's/^/::error::/' || true
          if [ "$rc" -ne 0 ]; then echo "::error::registry rows fail research/registry.py validate (exit $rc): nothing is kept or uploaded"; exit 1; fi
          # Steven's rule (Nov 5 21:59 UTC): $/h is tracked per contract type, so every row names contract type tennis and
          # the modules it changes; one day set for every row of the run; trial ids unique.
          jq -s -e 'all(.[]; .contract_type == "tennis" and .thread == "tennis-ta" and (.modules | type == "array" and length > 0))' "$ROWS" > /dev/null \
            || { echo "::error::a registry row lacks contract_type tennis, thread tennis-ta or its modules"; exit 1; }
          jq -s -e '([.[].by_day | keys] | unique | length) == 1' "$ROWS" > /dev/null || { echo "::error::registry rows of one run differ in their day set"; exit 1; }
          jq -s -e '([.[].trial_id] | length) == ([.[].trial_id] | unique | length)' "$ROWS" > /dev/null || { echo "::error::registry trial ids repeat"; exit 1; }
      - name: Keep the report on Drive
        run: |
          set -euo pipefail
          RUN="$GITHUB_RUN_ID"
          R="gdrive:kalshi-bot-archive/models/tennis-ta/runs/$RUN/report"
          # The whole report directory goes up: the report, the registry rows, the shard check, the plan and, on a disc
          # run, the league (league.md, league.csv, league.json).
          # A scored run (its registry rows already on Drive: a re-run of this job after a later step failed) keeps its
          # Drive copy, which the registry upload and the comment then come from. Rows that differ are refused (their
          # write time aside): the report is deterministic given the shards, so a difference means the inputs changed
          # under the same run id.
          L=$(rclone lsf "gdrive:kalshi-bot-archive/models/tennis-ta/runs/$RUN" --dirs-only)
          STORED=no
          if grep -qx 'report/' <<< "$L"; then L=$(rclone lsf "$R" --files-only); if grep -qxF "registry-v1-$RUN.jsonl" <<< "$L"; then STORED=yes; fi; fi
          if [ "$STORED" = yes ]; then
            rclone copy "$R" stored-report
            if ! cmp -s <(jq -c 'del(.ts)' "stored-report/registry-v1-$RUN.jsonl") <(jq -c 'del(.ts)' "report/registry-v1-$RUN.jsonl"); then
              echo "::error::run $RUN is already scored and this attempt's registry rows differ from the ones on Drive: nothing is overwritten or uploaded"; exit 1
            fi
            rm -rf report && mv stored-report report
            echo "run $RUN is already scored: its report on Drive (same registry rows) is kept and used below"
          else
            rclone copy report "$R"
          fi
      - name: Registry upload (registry/shards/tennis-ta/<run>.jsonl, once, after the completeness check)
        run: |
          set -euo pipefail
          RUN="$GITHUB_RUN_ID"
          ROWS="report/registry-v1-$RUN.jsonl"
          # Only a run whose shard set and history passed the completeness check is uploaded (that step fails the job
          # otherwise; its summary is checked here again).
          jq -e '(.problems | length) == 0' report/shards-check.json > /dev/null || { echo "::error::the completeness check did not pass: registry rows are not uploaded"; exit 1; }
          python3 -I /tmp/registry.py validate "$ROWS" > /dev/null
          # Registry shards are append-only and never edited: an existing upload of this run must hold the same rows.
          # Each level is listed only when its parent lists it, so a listing error fails the step instead of reading as
          # "not uploaded".
          HAVE=yes; P=gdrive:kalshi-bot-archive
          for c in registry/ shards/ tennis-ta/; do
            L=$(rclone lsf "$P" --dirs-only)
            if ! grep -qxF "$c" <<< "$L"; then HAVE=no; break; fi
            P="$P/${c%/}"
          done
          if [ "$HAVE" = yes ]; then L=$(rclone lsf "$P" --files-only); grep -qxF "$RUN.jsonl" <<< "$L" || HAVE=no; fi
          if [ "$HAVE" = yes ]; then
            rclone cat "$P/$RUN.jsonl" > uploaded.jsonl
            if ! cmp -s <(jq -c 'del(.ts)' uploaded.jsonl) <(jq -c 'del(.ts)' "$ROWS"); then
              echo "::error::registry/shards/tennis-ta/$RUN.jsonl already holds other rows: not overwritten"; exit 1
            fi
            echo "registry/shards/tennis-ta/$RUN.jsonl already holds this run's $(grep -c . "$ROWS") row(s)"
          else
            rclone copyto "$ROWS" "gdrive:kalshi-bot-archive/registry/shards/tennis-ta/$RUN.jsonl"
            echo "uploaded $(grep -c . "$ROWS") registry row(s) to registry/shards/tennis-ta/$RUN.jsonl"
          fi
      - name: Report as a commit comment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          MARK="Outputs: gdrive:kalshi-bot-archive/models/tennis-ta/runs/$GITHUB_RUN_ID/"
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --paginate --jq '.[].body' > posted.txt
          if grep -qF "$MARK" posted.txt; then
            echo "the report of run $GITHUB_RUN_ID is already posted on $GITHUB_SHA"; exit 0
          fi
          { head -c 54000 report/report.md; echo; head -c 4000 report/run-mechanics.md; echo; echo "$MARK"; } > body.md
          jq -Rs '{body: .}' body.md > req.json
          gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input req.json > /dev/null
