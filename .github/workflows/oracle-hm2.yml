          ls -la "$W/data/drill-parity"
          # own conditions from this run's drill parity; the other conditions' readings from HM2's parity (committed by parity-commit)
          python3 -m oracle.heat_hm2_drill live-ready --pack "$W/research/oracle_heat/latest/hm2_pack.json" --parity "$W/data/drill-parity" \
            --hm2-parity "$W/research/oracle_heat/hm2/parity"
      - name: Commit the pack and the parity summaries (aggregates only; a bot push starts no workflow)
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dst=research/oracle_heat/hm2/part3/parity; mkdir -p "$dst"
          for C in BTC ETH SOL XRP; do [ ! -f "data/drill-parity/$C/parity.json" ] || cp "data/drill-parity/$C/parity.json" "$dst/$C.json"; done
          echo "$RUN $GITHUB_SHA drill_parity_run=$GITHUB_RUN_ID" > "$dst/RUN"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst" research/oracle_heat/latest/hm2_pack.json
          if git diff --cached --quiet; then echo "nothing new to commit"; exit 0; fi
          git commit -q -m "Oracle HM2 Part 3: live parity and live_ready of the gate rows of run $RUN (written by the oracle-hm2 workflow)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin "$BR" && git push -q origin "HEAD:$BR"; then echo pushed; exit 0; fi
            sleep $((2 ** i))
          done
          echo "::error::could not push the Part 3 parity files"; exit 1
