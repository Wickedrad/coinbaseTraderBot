name: Benched jobs comparison

# The whole bot replayed on months of Kalshi history days with each reworked benched feature at its settings
# (research/benchedJobs.ts; thread "Rework benched features to $4.50/h"; Steven, Nov 1: deep on days, several market
# regimes). Reads the daily random sweep's caches from main (the Kalshi history and its replay, and the server's model and
# settings it copied) and downloads the older days; the server is not touched. Prints aggregates only (this repository is
# public) and posts the report as a comment on the commit.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Most recent replay days to compare'
        required: false
        default: '200'
      split:
        description: 'First day scored as held out (YYYY-MM-DD; empty = the middle day)'
        required: false
        default: ''
  push:
    branches: ['claude/benched-lab', 'claude/project-thread-g22fyz']
    paths: ['.github/workflows/benched-jobs.yml', 'research/benchedJobs.ts']

permissions:
  contents: write
  actions: read

# One group a commit: a new round no longer cancels the one still running (Nov 5, 10 jobs a thread).
concurrency:
  group: benched-jobs-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true

env:
  TJ_DAYS: ${{ inputs.days || '200' }}
  TJ_SPLIT: ${{ inputs.split || '' }}
  SWEEP_BANKROLL_USD: '200'
  # Steven, Nov 5 13:26 UTC: no DOGE at all for now. Kalshi lines of these series are dropped from the replayed days
  # (the coin's own price lines stay, so other coins' cross inputs are unchanged).
  TJ_EXCLUDE_RE: 'KXDOGE'
  # A push whose message holds [report-from:<run id>] only redoes the report of that earlier run (its replays and artifacts).
  TJ_REPORT_FROM: ${{ contains(github.event.head_commit.message, '[report-from:') && github.event.head_commit.message || '' }}

jobs:
  data:
    if: ${{ !contains(github.event.head_commit.message, '[report-from:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    outputs:
      variants: ${{ steps.v.outputs.variants }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      # Steven, Nov 2: history lives on Google Drive (raw and simulated), not in Actions caches; caches only pass data
      # between this run's jobs.
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Get the Kalshi history and its replay from Drive
        run: |
          bash deploy/drive_lab.sh get raw/kalshi-history data/history || echo "no raw Kalshi history on Drive yet"
          bash deploy/drive_lab.sh get simulated/benched-189d data/history-replay || echo "no simulated replay on Drive yet"
      - name: Repair stored quotes, download what is new, rebuild the replay
        run: |
          node --import tsx research/kalshiReplayData.ts --history data/history --out data/history-replay --days "$((TJ_DAYS + 3))" --budget-min 120 2>&1 \
            | grep -vE '^\[kalshi-replay-data\] (binance|kalshi|replay): .*(skipp|already|listing|page)' | tail -30
      - name: Keep the history and its replay on Drive
        if: always()
        run: |
          [ -d data/history ] && bash deploy/drive_lab.sh put raw/kalshi-history data/history
          [ -d data/history-replay ] && bash deploy/drive_lab.sh put simulated/benched-189d data/history-replay
      - name: Save the Kalshi history and its replay
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            data/history
            data/history-replay
          key: benched-jobs-replay-${{ github.run_id }}
      # Pin one copy of the server's model and settings for every replay of this run: the daily sweep on main saves a new
      # copy, and replays that start hours apart would otherwise compare different models (round 3, Oct 31).
      # Nov 5 audit: one server copy for every round, kept on Drive (models/benched-server-pin), so baselines stop moving
      # between runs (-0.17 to -0.58/h on the same days when the cache's copy changed). The first run pins the cache's newest.
      - name: The pinned server copy from Drive
        id: pin
        run: |
          bash deploy/drive_lab.sh get models/benched-server-pin data || true
          if [ -f data/models/model.json ]; then echo "hit=true" >> "$GITHUB_OUTPUT"; echo "pinned copy from Drive"; fi
      - name: Restore the server's model and settings (the sweep's copy on main)
        if: steps.pin.outputs.hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: kalshi-server-none
          restore-keys: kalshi-server-
      - name: Stop when no copy of the server's model is cached (the daily sweep on main saves one at 09:23 UTC)
        run: '[ -f data/models/model.json ] || { echo "::error::no server copy cached: rerun after the daily sweep"; exit 1; }'
      - name: Pin it on Drive (first run only)
        if: steps.pin.outputs.hit != 'true'
        run: bash deploy/drive_lab.sh put models/benched-server-pin data --include "models/**" --include "sweep-env/**"
      - name: The model copy's hash (in every report)
        run: echo "model_copy_hash $(sha256sum data/models/model.json | cut -c1-12), trained to $(node -e "try{const m=require('./data/models/model.json');console.log(m.trainedTo||m.trainedAt||m.meta?.trainedTo||'unknown')}catch{console.log('unknown')}")"
      - name: Pin that copy for every replay of this run
        uses: actions/cache/save@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: benched-jobs-server-${{ github.run_id }}
      - name: The variants
        id: v
        run: |
          echo "variants=$(node --import tsx -e "import('./research/benchedJobs.ts').then((m) => console.log(JSON.stringify(Object.keys(m.VARIANTS))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      # The account's runners are shared by every thread (Nov 5: 10 jobs a thread, ~50 for the project): eight replays at a time.
      max-parallel: 10
      matrix:
        variant: ${{ fromJson(needs.data.outputs.variants) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - id: replay
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: benched-jobs-replay-${{ github.run_id }}
      # Nov 2: the run's own cache was evicted after ~4 h (the project shares the 10 GB cache), failing six variants.
      # Then the data job's Drive copy is read instead, topped up if needed.
      - if: steps.replay.outputs.cache-hit != 'true'
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Read the history from Drive when the run's cache was evicted
        if: steps.replay.outputs.cache-hit != 'true'
        run: |
          bash deploy/drive_lab.sh get raw/kalshi-history data/history || true
          bash deploy/drive_lab.sh get simulated/benched-189d data/history-replay || true
          node --import tsx research/kalshiReplayData.ts --history data/history --out data/history-replay --days "$((TJ_DAYS + 3))" --budget-min 120 2>&1 | tail -5
      - name: Restore the server's model and settings (the sweep's copy on main)
        id: server
        uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: benched-jobs-server-${{ github.run_id }}
          restore-keys: |
            benched-jobs-server-
            kalshi-server-
      - name: Stop when no copy of the server's model is cached
        run: '[ -f data/models/model.json ] || { echo "::error::no server copy cached"; exit 1; }'
      - name: Replay ${{ matrix.variant }}
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS"
          if [ -n "$TJ_EXCLUDE_RE" ]; then
            for f in data/sweep-days/*; do
              src=$(readlink -f "$f"); tmp="$src.tmp"
              if [[ "$src" == *.gz ]]; then { zcat "$src" | grep -vE "$TJ_EXCLUDE_RE" || true; } | gzip -1 > "$tmp"; else { grep -vE "$TJ_EXCLUDE_RE" "$src" || true; } > "$tmp"; fi
              mv "$tmp" "$src"
            done
            echo "dropped Kalshi lines matching $TJ_EXCLUDE_RE; left: $(for f in data/sweep-days/*; do zgrep -c "$TJ_EXCLUDE_RE" "$f" 2>/dev/null; done | paste -sd+ | bc)"
          fi
          if [ -f data/sweep-env/train.env ]; then set -a; . data/sweep-env/train.env; set +a; echo "server settings: $(wc -l < data/sweep-env/train.env) line(s)"; else echo "no server settings cached: the bot's defaults"; fi
          cp -rn data/sweep-env/history/. data/history/ 2>/dev/null || true
          # Nov 5 audit: fresh probation (not paper's state; paper has no say) and the take-profit bench off (#258/#266).
          export TAKE_PROFIT_BENCH=false
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper RS_PROBATION_FILE="$RUNNER_TEMP/fresh-probation.json" RS_TRIALS_FILE="$GITHUB_WORKSPACE/data/sweep-env/component_trials.json"
          echo "model: $([ -f data/models/model.json ] && echo "the server's" || echo identity)"
          node --import tsx research/benchedJobs.ts run --variant "${{ matrix.variant }}" --days data/sweep-days --model data/models/model.json --out research/out/benched-jobs \
            2>&1 | grep -E '^\[benched-jobs\]|Error|error' | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benched-jobs-${{ matrix.variant }}
          path: research/out/benched-jobs/
          retention-days: 30

  report:
    needs: [data, run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: Which run to report
        id: src
        run: |
          from=$(printf '%s' "$TJ_REPORT_FROM" | grep -oE '\[report-from:[0-9]+\]' | grep -oE '[0-9]+' || true)
          echo "run=${from:-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"
      # The same paths as the save in the data job: a cache's version covers its paths, so a subset never matches.
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: benched-jobs-replay-${{ steps.src.outputs.run }}
          # If evicted, the report takes the days the results span (benchedJobs.ts dayList).
      - uses: actions/download-artifact@v4
        with:
          pattern: benched-jobs-*
          path: research/out/benched-jobs
          merge-multiple: true
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}
      - name: Report
        run: |
          # Without the replay (its caches evicted) the report takes the days the results span (benchedJobs.ts dayList).
          [ -d data/history-replay ] && node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS"
          { node --import tsx research/benchedJobs.ts report --days data/sweep-days --out research/out/benched-jobs $([ -n "$TJ_SPLIT" ] && echo --split "$TJ_SPLIT") 2>&1; } | tee "$RUNNER_TEMP/report.txt" | tail -80
      # Trial registry (meta plan thread, Nov 5): one row per variant with its daily $ (no DOGE), synthetic books, to Drive.
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Registry rows to Drive (registry/shards/benched)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch -q --depth 1 origin claude/project-thread-79ntof
          git show FETCH_HEAD:research/registry.py > "$RUNNER_TEMP/registry.py"
          export TJ_VARIANT_ENVS="$(node --import tsx -e "import('./research/benchedJobs.ts').then((m) => console.log(JSON.stringify({ ...m.LATER, ...m.VARIANTS })))")"
          RUN=${{ steps.src.outputs.run }}
          SHA=$(gh api "repos/${{ github.repository }}/actions/runs/$RUN" --jq .head_sha)
          python3 deploy/benched_registry.py research/out/benched-jobs "$RUN" "$SHA" "$RUNNER_TEMP/registry.py" "$RUNNER_TEMP/benched-$RUN.jsonl"
          python3 "$RUNNER_TEMP/registry.py" validate "$RUNNER_TEMP/benched-$RUN.jsonl" | tail -5
          rclone mkdir gdrive:kalshi-bot-archive/registry/shards/benched
          rclone copyto "$RUNNER_TEMP/benched-$RUN.jsonl" "gdrive:kalshi-bot-archive/registry/shards/benched/$RUN.jsonl"
          echo "registry shard: registry/shards/benched/$RUN.jsonl"
      - name: Post the report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "Benched jobs comparison (deep history), run ${{ steps.src.outputs.run }}"; echo; echo '```'; tail -120 "$RUNNER_TEMP/report.txt" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"
