# Paper pool audit (read-only). Reconstructs where the Kalshi paper account's cash came from: the funded / refilled
# counters, the nightly Drive snapshots, and a replay of every audit-log fill and settlement against the balance reads.
# Changes nothing on the server; copies small state files, the audit log (Drive first, only the days Drive lacks from the
# server at 8 MB/s) and some text facts to the runner, and prints aggregates only (the repository is public).
# Runs on a push to its branch or by hand. Branch-only: not for merge.
name: Paper pool audit
on:
  push:
    branches: [claude/project-thread-mrqen7]
    paths: ['.github/workflows/pool-audit.yml', 'deploy/pool_audit.py']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Small state files and text facts from the server (read-only)
        run: |
          set -uo pipefail
          mkdir -p data/state data/facts data/audit data/drive-paper
          for f in paper_exchange.json training.json epochs.jsonl vault.json balance_monitor.json equity_guard.json; do
            rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" "bot:bot/data/$f" data/state/ 2>/dev/null || echo "no $f on the server"
          done
          ssh bot "grep -E '^(TRADING_MODE|PAPER_|MIN_TRADABLE_|PERP_PAPER_|VAULT_|KILL_|DATA_DIR|AUTO_TRAIN=)' ~/bot/bot.env" > data/facts/env.txt 2>/dev/null || true
          ssh bot "find ~/bot/data -maxdepth 2 \( -name '*.corrupt-*' -o -name 'paper_exchange*' -o -name 'training*' -o -name 'vault*' -o -name 'epochs*' \) -printf '%TY-%Tm-%Td %TH:%TM %s %P\n' | sort" > data/facts/corrupt.txt 2>/dev/null || true
          ssh bot 'crontab -l 2>/dev/null; ls /etc/cron.d /etc/cron.daily 2>/dev/null; systemctl list-timers --all --no-pager 2>/dev/null | head -30' > data/facts/cron.txt || true
          ssh bot 'journalctl -u kalshi-bot --since "2026-10-25" --no-pager -o short-iso 2>/dev/null | grep -E "Started |Stopped |Stopping |Main process exited|Failed with result|Scheduled restart|oom|Killed|killed" | cut -c1-220' > data/facts/journal.txt || true
          rsync -a bot:bot/deploys.log data/facts/deploys.log 2>/dev/null || ssh bot 'tail -n 400 ~/bot/deploys.log' > data/facts/deploys.log 2>/dev/null || true
          # /api/status: the dashboard password is read on the server and handed to curl on stdin, never printed.
          ssh bot bash -s <<'SH' > data/facts/status.json || echo '{}' > data/facts/status.json
          PW=$(sed -n 's/^DASHBOARD_PASSWORD=//p' ~/bot/bot.env 2>/dev/null | tail -1 | tr -d '\r')
          case "$PW" in \"*\") PW=${PW#\"}; PW=${PW%\"};; esac
          if [ -n "$PW" ]; then printf 'Authorization: Bearer %s\n' "$PW" | curl -s -m 20 -H @- http://localhost:3000/api/status; else curl -s -m 20 http://localhost:3000/api/status; fi
          SH
          ls -la data/state data/facts
      - name: Drive snapshots of the paper books and the archived audit days
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -uo pipefail
          if [ -z "$RCLONE_CONF" ]; then echo "RCLONE_CONF not set: Drive sections skipped"; exit 0; fi
          bash .github/scripts/install-rclone.sh
          mkdir -p ~/.config/rclone && printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf && chmod 600 ~/.config/rclone/rclone.conf
          R=gdrive:kalshi-bot-archive
          rclone copy "$R/paper" data/drive-paper --include 'paper_exchange.json' --transfers 4 || echo "paper copy failed"
          find data/drive-paper -name paper_exchange.json | sort | head -40
          rclone lsf "$R/audit" --files-only > "$RUNNER_TEMP/drive-audit.txt" || true
          echo "audit files on Drive: $(wc -l < "$RUNNER_TEMP/drive-audit.txt")"; grep -E '^audit-' "$RUNNER_TEMP/drive-audit.txt" | head -60
          rclone copy "$R/audit" data/audit --include 'audit-*' --transfers 4 || echo "audit copy failed"
          du -sh data/audit
      - name: The audit days Drive does not have yet (from the server, 8 MB/s, read-only)
        run: |
          set -uo pipefail
          ssh bot 'ls -1 ~/bot/data/audit/' | grep -E '^audit-[0-9-]{10}' | sort > "$RUNNER_TEMP/server-audit.txt"
          echo "audit files on the server: $(wc -l < "$RUNNER_TEMP/server-audit.txt")"
          # a file is needed when data/audit lacks it, or the server copy is a still-growing current day (always re-copied)
          today=$(date -u +%F); yday=$(date -u -d yesterday +%F)
          : > "$RUNNER_TEMP/need.txt"
          while read -r f; do
            if [ ! -e "data/audit/$f" ] || [[ "$f" == audit-$today* ]] || [[ "$f" == audit-$yday* ]]; then echo "$f" >> "$RUNNER_TEMP/need.txt"; fi
          done < "$RUNNER_TEMP/server-audit.txt"
          echo "to copy from the server: $(wc -l < "$RUNNER_TEMP/need.txt")"; cat "$RUNNER_TEMP/need.txt"
          [ -s "$RUNNER_TEMP/need.txt" ] && rsync -a --whole-file --bwlimit=8000 --rsync-path="nice -n 19 rsync" --files-from="$RUNNER_TEMP/need.txt" bot:bot/data/audit/ data/audit/ || true
          du -sh data/audit; ls data/audit | wc -l
      - name: Pool audit report
        run: python3 deploy/pool_audit.py data 2>&1 | tee data/pool-audit.txt | cut -c1-400
