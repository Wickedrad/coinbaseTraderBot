name: Loss review daily file

# Builds the day's heat trip file (python/lossreview) from the audit days already on Drive, joins public candles, runs the
# code triage and keeps the per-trade file on Drive (derived/loss-review/days). The model review (Haiku tags, Sonnet
# hypotheses, adversary) is a separate Claude routine that reads it from Drive; this job spends no model tokens and
# never contacts the server. Research only: nothing here reaches the bot.
#
# The repository is public: nothing is uploaded as an artifact and the log prints aggregates only. Needs RCLONE_CONF
# (as drive-archive.yml). The audit of a UTC day reaches Drive at 07:20 UTC the next day; this runs after it.

on:
  schedule:
    # 11:30 UTC = 6:30 AM EST: the previous UTC day is on Drive (archive 07:20 UTC), the review routine reads at 15:00 UTC.
    - cron: '30 11 * * *'
  workflow_dispatch:
    inputs:
      day:
        description: 'UTC day to build, YYYY-MM-DD (empty = yesterday)'
        required: false
        default: ''
  push:
    branches: ['claude/project-thread-kjji9x']
    paths: ['.github/loss-review-trigger.txt']

permissions:
  contents: read

concurrency:
  group: loss-review
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Build the day's trip file
        env:
          INPUT_DAY: ${{ inputs.day }}
        run: |
          set -euo pipefail
          DAY="$INPUT_DAY"
          if [ "$GITHUB_EVENT_NAME" = push ]; then DAY=$(head -1 .github/loss-review-trigger.txt | tr -d '[:space:]'); fi
          if [ -z "$DAY" ]; then DAY=$(date -u -d 'yesterday' +%F); fi
          bash .github/scripts/loss_review_run.sh "$DAY"
