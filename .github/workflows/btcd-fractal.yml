name: BTC.D fractal study

# Walk-forward study of the BTC.D fractal (research/btcd_fractal/study.py, docs/FRACTAL.md): TradingView daily
# history through tvdatafeed, the time-warp fit with a dynamic level map, the adversary, charts. Results and the
# history it pulled are committed back to the branch (public market data; nothing from the server or bot.env).
on:
  workflow_dispatch:
    inputs:
      surrogates:
        description: 'placebo parents per kind'
        default: '60'
      adv_by:
        description: 'adversary on the best setting by score or by ic'
        default: 'score'
      fast:
        description: 'set to 1 for the smoke-test sizes'
        default: ''
      round:
        description: 'study round: 1 (study.py), 2 (study2.py), 3 (study3.py, time dilation), 4 (study4.py, waterfall readiness), 5 (study5.py, dilation drivers), 6 (study6.py four series + study7.py oracle trial) or 8 (every study8_*.py module through the shared harness)'
        default: '8'
  push:
    branches: [claude/project-thread-axoa26, claude/project-thread-096xlq]
    paths:
      - 'research/btcd_fractal/*.py'
      - 'research/btcd_fractal/ROUND8_BRIEF.md'
      - '.github/workflows/btcd-fractal.yml'

permissions:
  contents: write

concurrency:
  group: btcd-fractal-${{ github.ref }}
  cancel-in-progress: true

jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: |
          pip install -q --disable-pip-version-check numpy pandas numba matplotlib websocket-client requests
          pip install -q --disable-pip-version-check --no-cache-dir git+https://github.com/rongardF/tvdatafeed.git
      - name: Fetch TradingView history
        run: python3 research/btcd_fractal/fetch.py --out research/btcd_fractal/data
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - name: The bot's own engine on the same history (bot/macro/fractalEngine.ts)
        continue-on-error: true
        run: |
          npm ci --silent --no-audit --no-fund
          H="$RUNNER_TEMP/history/tradingview/BTC.D"; mkdir -p "$H"
          cp research/btcd_fractal/data/BTC.D_1d.csv "$H/1d.csv"
          if [ -f research/btcd_fractal/data/USDT.D_1d.csv ]; then mkdir -p "$RUNNER_TEMP/history/tradingview/USDT.D"; cp research/btcd_fractal/data/USDT.D_1d.csv "$RUNNER_TEMP/history/tradingview/USDT.D/1d.csv"; fi
          mkdir -p research/btcd_fractal/out
          npx tsx research/fractalStudy.ts --history "$RUNNER_TEMP/history" --out research/btcd_fractal/out/engine_study.json 2>&1 | tail -60
      - name: Study
        if: ${{ (github.event.inputs.round || '8') == '1' }}
        # dispatch inputs reach the shell as environment variables, never pasted into the script
        env:
          SURROGATES: ${{ github.event.inputs.surrogates || '60' }}
          ADV_BY: ${{ github.event.inputs.adv_by || 'ic' }}
        run: |
          case "$SURROGATES" in ''|*[!0-9]*) echo "surrogates must be a number"; exit 1;; esac
          mkdir -p research/btcd_fractal/out/prev; cp research/btcd_fractal/out/results.json research/btcd_fractal/out/prev/results_score_adversary.json 2>/dev/null || true
          python3 research/btcd_fractal/study.py --data research/btcd_fractal/data --out research/btcd_fractal/out --surrogates "$SURROGATES" --adv-by "$ADV_BY" 2>&1 | tee "$RUNNER_TEMP/study.log" | tail -80
      - name: Study round 2
        if: ${{ (github.event.inputs.round || '8') == '2' }}
        run: |
          python3 research/btcd_fractal/study2.py --data research/btcd_fractal/data --out research/btcd_fractal/out2 --placebos 40 --k 6 2>&1 | tee "$RUNNER_TEMP/study2.log" | tail -120
      - name: Study round 3 (time dilation)
        if: ${{ (github.event.inputs.round || '8') == '3' }}
        run: |
          python3 research/btcd_fractal/study3.py --data research/btcd_fractal/data --out research/btcd_fractal/out3 --placebos 60 2>&1 | tee "$RUNNER_TEMP/study3.log" | tail -80
      - name: Study round 4 (waterfall readiness)
        if: ${{ (github.event.inputs.round || '8') == '4' }}
        run: |
          python3 research/btcd_fractal/study4.py --data research/btcd_fractal/data --out research/btcd_fractal/out4 --nulls 400 2>&1 | tee "$RUNNER_TEMP/study4.log" | tail -80
      - name: Study round 5 (what drives the dilation; the 2021 waterfall out of sample)
        if: ${{ (github.event.inputs.round || '8') == '5' }}
        run: |
          python3 research/btcd_fractal/study5.py --data research/btcd_fractal/data --out research/btcd_fractal/out5 --nulls 400 2>&1 | tee "$RUNNER_TEMP/study5.log" | tail -80
      - name: Study rounds 6 and 7 (USDT.D, TOTAL3, ETH/BTC walks + confluence; the oracle trial)
        if: ${{ (github.event.inputs.round || '8') == '6' }}
        run: |
          python3 research/btcd_fractal/study6.py --data research/btcd_fractal/data --out research/btcd_fractal/out6 --placebos 30 --nulls 400 2>&1 | tee "$RUNNER_TEMP/study6.log" | grep -v "^    {" | tail -60
          python3 research/btcd_fractal/study7.py --data research/btcd_fractal/data --out research/btcd_fractal/out7 --round6 research/btcd_fractal/out6/results6.json --rounds 12 --nulls 40 2>&1 | tee "$RUNNER_TEMP/study7.log" | cut -c1-600 | tail -40
      - name: Study round 8 (regime models through the shared harness; ROUND8_BRIEF.md)
        if: ${{ (github.event.inputs.round || '8') == '8' }}
        env:
          FAST: ${{ github.event.inputs.fast || '' }}
        run: |
          pip install -q --disable-pip-version-check hmmlearn ripser 2>&1 | tail -2 || true
          mkdir -p research/btcd_fractal/out8
          for f in research/btcd_fractal/study8_*.py; do
            name=$(basename "$f" .py); name=${name#study8_}
            case "$name" in common) continue;; esac
            echo "=== $name ==="
            start=$(date +%s)
            python3 "$f" --data research/btcd_fractal/data --out "research/btcd_fractal/out8/$name" ${FAST:+--fast} 2>&1 | tee "research/btcd_fractal/out8/$name.log" | tail -60 | cut -c1-400
            echo "=== $name done in $(( $(date +%s) - start ))s ==="
          done
      - name: Commit results to the branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898783+github-actions[bot]@users.noreply.github.com"
          cp "$RUNNER_TEMP/study.log" research/btcd_fractal/out/study.log 2>/dev/null || true
          mkdir -p research/btcd_fractal/out2; cp "$RUNNER_TEMP/study2.log" research/btcd_fractal/out2/study2.log 2>/dev/null || true
          mkdir -p research/btcd_fractal/out3; cp "$RUNNER_TEMP/study3.log" research/btcd_fractal/out3/study3.log 2>/dev/null || true
          mkdir -p research/btcd_fractal/out4; cp "$RUNNER_TEMP/study4.log" research/btcd_fractal/out4/study4.log 2>/dev/null || true
          mkdir -p research/btcd_fractal/out5; cp "$RUNNER_TEMP/study5.log" research/btcd_fractal/out5/study5.log 2>/dev/null || true
          mkdir -p research/btcd_fractal/out6 research/btcd_fractal/out7; cp "$RUNNER_TEMP/study6.log" research/btcd_fractal/out6/study6.log 2>/dev/null || true; cp "$RUNNER_TEMP/study7.log" research/btcd_fractal/out7/study7.log 2>/dev/null || true
          git add -f research/btcd_fractal/data research/btcd_fractal/out research/btcd_fractal/out2 research/btcd_fractal/out3 research/btcd_fractal/out4 research/btcd_fractal/out5 research/btcd_fractal/out6 research/btcd_fractal/out7 research/btcd_fractal/out8
          git commit -q -m "BTC.D fractal study results (run ${{ github.run_id }}) [skip ci]" || { echo "nothing to commit"; exit 0; }
          for i in 1 2 3 4; do git pull -q --rebase origin "${GITHUB_REF_NAME}" && git push -q origin "HEAD:${GITHUB_REF_NAME}" && break; sleep $((2**i)); done
