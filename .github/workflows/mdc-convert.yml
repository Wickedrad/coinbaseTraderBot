name: Compact copies on Drive

# Adds a lossless compact copy (.mdc, bot/marketdata/compactRecording.ts) beside the files already on Google Drive
# (gdrive:kalshi-bot-archive). Every copy is decoded and compared byte for byte with its source before it is uploaded.
# Nothing on Drive is ever deleted or overwritten here: removing the gzip originals is a separate step that needs the
# owner's OK. Reads no server. Prints counts and sizes only (public repo: no data leaves the runner except to Drive).
#
#   recordings: md-DAY.jsonl.gz -> md-DAY.mdc in recordings/, for days without one (at most max_days per run)
#   raw | simulated | derived: every .jsonl/.csv(.gz) under that folder (or under `subdir` of it) -> <name>.mdc beside it
#
# Keeps clear of the Drive nightly (07:20 UTC = 2:20 AM EST): a run will not start between 06:45 and 08:15 UTC.

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'recordings | raw | simulated | derived'
        required: true
        default: 'recordings'
      subdir:
        description: 'Only this subfolder of raw/simulated/derived (empty = all of it)'
        required: false
        default: ''
      max_days:
        description: 'recordings: at most this many days per run (~25 min each)'
        required: false
        default: '4'

permissions:
  contents: read

concurrency:
  group: mdc-convert-${{ inputs.target }}
  cancel-in-progress: false

env:
  DRIVE_ROOT: gdrive:kalshi-bot-archive

jobs:
  convert:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      - name: Stay clear of the Drive nightly
        run: |
          now=$(date -u +%H%M)
          if [ "$now" -ge 0645 ] && [ "$now" -lt 0815 ]; then echo "::error::06:45-08:15 UTC is kept clear for the Drive nightly"; exit 1; fi
          case "${{ inputs.target }}" in recordings|raw|simulated|derived) ;; *) echo "::error::bad target"; exit 1;; esac
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Tools
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          if [ -z "$RCLONE_CONF" ]; then echo "::error::RCLONE_CONF secret is not set"; exit 1; fi
          bash .github/scripts/install-rclone.sh
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf && chmod 600 ~/.config/rclone/rclone.conf
          npm ci --ignore-scripts --silent >/dev/null 2>&1 && npm i -g tsx@4 --silent >/dev/null 2>&1
      - name: Recordings
        if: ${{ inputs.target == 'recordings' }}
        env:
          MAX: ${{ inputs.max_days }}
        run: |
          set -euo pipefail
          W=$RUNNER_TEMP/w; mkdir -p "$W"
          rclone lsf "$DRIVE_ROOT/recordings" --files-only > "$W/ls.txt"
          TODO=$(grep -E '^md-[0-9-]{10}\.jsonl\.gz$' "$W/ls.txt" | sed -E 's/\.jsonl\.gz$//' | while read -r b; do grep -qx "$b.mdc" "$W/ls.txt" || echo "$b"; done | sort | head -n "${MAX:-4}")
          [ -n "$TODO" ] || { echo "every recorded day on Drive already has its .mdc"; exit 0; }
          for b in $TODO; do
            rclone copy "$DRIVE_ROOT/recordings/$b.jsonl.gz" "$W/" --transfers 1
            tsx scripts/mdc.ts encode "$W/$b.jsonl.gz" "$W/$b.mdc"
            tsx scripts/mdc.ts verify "$W/$b.mdc" "$W/$b.jsonl.gz"
            rclone copy "$W/$b.mdc" "$DRIVE_ROOT/recordings/" --transfers 1
            echo "$b: .mdc uploaded" >> "$GITHUB_STEP_SUMMARY"
            rm -f "$W/$b.jsonl.gz" "$W/$b.mdc"
          done
      - name: History folder
        if: ${{ inputs.target != 'recordings' }}
        env:
          TOP: ${{ inputs.target }}
          SUB: ${{ inputs.subdir }}
        run: |
          set -euo pipefail
          case "$SUB" in *..*) echo "::error::bad subdir"; exit 1;; esac
          R="$DRIVE_ROOT/$TOP${SUB:+/$SUB}"; S=$RUNNER_TEMP/src; O=$RUNNER_TEMP/out; mkdir -p "$S" "$O"
          # Only sources that have no .mdc beside them yet.
          rclone lsf -R --files-only "$R" > "$RUNNER_TEMP/ls.txt"
          grep -E '\.(jsonl|csv)(\.gz)?$' "$RUNNER_TEMP/ls.txt" | while read -r f; do
            m=$(echo "$f" | sed -E 's/\.gz$//; s#(^|/)(md-[0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl$#\1\2#').mdc
            grep -qxF "$m" "$RUNNER_TEMP/ls.txt" || echo "$f"
          done > "$RUNNER_TEMP/todo.txt"
          echo "$(wc -l < "$RUNNER_TEMP/todo.txt") files to compact under $TOP/${SUB}" | tee -a "$GITHUB_STEP_SUMMARY"
          [ -s "$RUNNER_TEMP/todo.txt" ] || exit 0
          # Chunks of 40 files, 3 at a time (one per core, one core left for rclone), each uploaded as soon as it is
          # verified, so a run that hits its time budget keeps everything it finished; the next run skips those.
          split -l 40 -d -a 4 "$RUNNER_TEMP/todo.txt" "$RUNNER_TEMP/chunk-"
          export R S O START=$(date +%s) BUDGET=$((235 * 60))
          one() {
            c=$1; n=$(basename "$c")
            if [ $(( $(date +%s) - START )) -gt "$BUDGET" ]; then echo "$n: skipped (time budget; run again)"; return 0; fi
            rclone copy "$R" "$S/$n" --files-from "$c" --transfers 4
            tsx scripts/mdc.ts encode-tree "$S/$n" "$O/$n" | sed "s/^/$n: /"
            rclone copy "$O/$n" "$R" --include '*.mdc' --transfers 4
            rm -rf "${S:?}/${n:?}" "${O:?}/${n:?}"
          }
          export -f one
          ls "$RUNNER_TEMP"/chunk-* | xargs -P 3 -I{} bash -c 'one "$@"' _ {} | tee -a "$GITHUB_STEP_SUMMARY"
