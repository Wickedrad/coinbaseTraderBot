name: Oracle heat map

# OR-HM1 (python/oracle/prereg/OR-HM1.md; Steven's heat-map spec, Nov 11 2026): heat strips over the TA-Lib vocabulary
# and candlestick patterns on 1m/5m/15m/1h bars, the pair and triple matrix with BTC.D / USDT.D, and the league table.
# Coin price only, discovery data only (nothing at or after 2026-08-01 is read). NEVER DOGE.
#
# Pushes drive it (a new workflow cannot be dispatched until it is on main). Tags in the HEAD commit message:
#   none                     the heat tests only
#   [oracle-heat]            the study: one job per coin (BTC, ETH, SOL, XRP), then the league
#   [oracle-heat-assets:BTC] narrow the coins (never DOGE)
# Outputs (aggregates only): Drive models/oracle-heat/runs/<run>/<coin>/ and league/; the league also as a run artifact
# and a commit comment. No per-minute rows leave the runner.

on:
  push:
    branches: [claude/project-thread-nvd096]
    paths: ['.github/workflows/oracle-heat.yml', 'python/oracle/heat.py', 'python/oracle/tests/test_heat.py',
            'python/oracle/prereg/OR-HM1.md']

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[oracle-heat]') && format('oracle-heat-study-{0}', github.run_id) || format('oracle-heat-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  R: gdrive:kalshi-bot-archive
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      study: ${{ steps.plan.outputs.study }}
      assets: ${{ steps.plan.outputs.assets }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt pytest
      - name: Heat tests
        working-directory: python
        run: python3 -m pytest -q oracle/tests/test_heat.py 2>&1 | tail -20
      - name: Plan
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if grep -qF '[oracle-heat]' <<< "$MSG"; then echo "study=true" >> "$GITHUB_OUTPUT"; else echo "study=false" >> "$GITHUB_OUTPUT"; fi
          a=$(grep -oE '\[oracle-heat-assets:[A-Z,]+\]' <<< "$MSG" | head -1 | sed -E 's/.*:([A-Z,]+)\]/\1/' || true)
          [ -n "$a" ] || a=BTC,ETH,SOL,XRP
          j=$(tr ',' '\n' <<< "$a" | grep -E '^(BTC|ETH|SOL|XRP)$' | jq -Rnc '[inputs]')
          [ "$j" != '[]' ] || { echo "::error::no allowed coin in $a (BTC, ETH, SOL, XRP; never DOGE)"; exit 1; }
          echo "assets=$j" >> "$GITHUB_OUTPUT"; echo "coins: $j"

  coin:
    needs: test
    if: needs.test.outputs.study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        asset: ${{ fromJSON(needs.test.outputs.assets) }}
    env:
      A: ${{ matrix.asset }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: 1-minute spot history (raw/perp-ta-history/<A>, read only)
        run: |
          set -euo pipefail
          [ "$A" != DOGE ] || { echo "NEVER DOGE"; exit 1; }
          bash deploy/drive_lab.sh get "raw/perp-ta-history/$A" "data/hist" --include "/binance-1m/$A/1m.csv"
          f="data/hist/binance-1m/$A/1m.csv"; [ -s "$f" ] || { echo "::error::no $A 1-minute CSV on Drive"; exit 1; }
          echo "$A: $(du -h "$f" | cut -f1), header $(head -1 "$f"), first $(sed -n 2p "$f" | cut -d, -f1)"
      - name: Heat strips, pairs, triples
        working-directory: python
        run: |
          set -euo pipefail
          /usr/bin/time -v python3 -m oracle.heat coin --asset "$A" --csv "../data/hist/binance-1m/$A/1m.csv" \
            --dom ../research/btcd_fractal/data --out "../out/$A" 2> >(grep -E 'Maximum resident|Elapsed|Error|error' >&2) | tail -40
      - name: Keep on Drive
        run: bash deploy/drive_lab.sh put "models/oracle-heat/runs/$GITHUB_RUN_ID/$A" "out/$A"

  league:
    needs: [test, coin]
    if: ${{ !cancelled() && needs.test.outputs.study == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: League
        run: |
          set -euo pipefail
          bash deploy/drive_lab.sh get "models/oracle-heat/runs/$GITHUB_RUN_ID" data/coins --include "/*/heat.csv.gz" --include "/*/meta.json"
          ls data/coins
          (cd python && python3 -m oracle.heat league --inputs ../data/coins --out ../out/league) | tail -40
          bash deploy/drive_lab.sh put "models/oracle-heat/runs/$GITHUB_RUN_ID/league" out/league
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-heat-league
          path: out/league
          retention-days: 30
      - name: Card (commit comment, aggregates only)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "**Oracle heat map (OR-HM1)**, run $GITHUB_RUN_ID. Coin price, discovery only (A 2020-2024, B 2025-Jul 2026). Drive: models/oracle-heat/runs/$GITHUB_RUN_ID/"; echo; head -c 60000 out/league/league.md; } > "$RUNNER_TEMP/comment.md"
          jq -n --rawfile body "$RUNNER_TEMP/comment.md" '{body: $body}' | gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" --input - --jq .html_url || echo "::warning::could not post the comment"
