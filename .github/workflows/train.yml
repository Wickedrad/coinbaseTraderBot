# Remote training: runs the training pipeline (research/pipeline.ts) on a GitHub-hosted runner instead of
# the Lightsail box, whose burstable CPU cannot sustain the bot plus training (AUTO_TRAIN=remote on the
# server, the default). Once a day, and manually from the Actions tab:
#
#   1. copies the server's data off it (read-only): the last DAYS days of recordings from FROM_DAY on (full-book days
#      only, Nov 11 on: meta plan v2), the candle history,
#      the models directory (pipeline state, tournaments in progress, journals) and the rest of ~/bot/data
#   2. runs the pipeline here on the runner's own CPUs (no throttling; up to ~5 h, it checkpoints after
#      every step, so a run cut short continues next time): first the models trained on the bot's own
#      recordings (copied back at once), then everything else, under a memory watchdog
#   3. copies the models directory and the refreshed history back; the running bot hot-swaps every model
#      that changed within AUTO_TRAIN_WATCH_SEC (no restart)
#
# The server's bot.env is read with every credential line removed (keys, secrets, tokens, passwords) so
# the pipeline uses the same settings; nothing secret leaves the server. This repository is public, so
# the job prints only step names and whether each promoted a model; the full pipeline log is copied to
# ~/bot/data/models/logs/ on the server (the learning report shows its tail).
#
# Required secrets (the same as Deploy): LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Remote training

on:
  # Daily schedule HELD (meta plan v2, decision D1, Steven Nov 12 17:00 UTC / 12:00 PM EST): no model reaches the bot
  # unchecked until the heat-safety check (T2) is in. Manual runs stay available. Put the two lines back with T2:
  # schedule:
  #   - cron: '17 7 * * *'
  workflow_dispatch:
    inputs:
      only:
        description: 'Optional: pipeline steps to run, comma separated (e.g. ta_net,setups); empty = everything due'
        required: false
        default: ''
      days:
        description: 'Recorded days to copy from the server (most recent)'
        required: false
        default: '45'
      from_day:
        description: 'First recorded day (UTC, YYYY-MM-DD) training may read; older recordings are not copied. "none" = no limit'
        required: false
        default: '2026-11-11'
      min_days:
        description: 'Recorded days the SNN, MLP, perps and vol model need before they train (AUTO_TRAIN_MIN_DAYS) while from_day is set'
        required: false
        default: '7'

permissions:
  contents: read

concurrency:
  group: remote-training
  cancel-in-progress: false

jobs:
  train:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    env:
      DAYS: ${{ inputs.days || '45' }}
      ONLY: ${{ inputs.only || '' }}
      # Full-book recordings only (Steven, Nov 11: no recordings from before the empty-snapshot fix of Nov 10 03:44 UTC;
      # meta plan v2 decision D2). The first whole full-book day is Nov 11. A scheduled run uses the default.
      FROM_DAY: ${{ inputs.from_day || '2026-11-11' }}
      FULL_MIN_DAYS: ${{ inputs.min_days || '7' }}
    steps:
      - uses: actions/checkout@v5

      # The job's clock starts here, not at the Train step: copying from the server took 47 to 99 minutes on Oct 30 to
      # Nov 1, and with the pipeline's 300 minutes counted from after the copy the job hit its 350-minute limit every
      # day (cancelled mid-pipeline, Nov 1 also mid copy-back). The Train step plans its phases against this deadline.
      - name: Job start
        run: echo "JOB_T0=$(date +%s)" >> "$GITHUB_ENV"

      - name: Free disk space (preinstalled toolchains the pipeline does not use)
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL || true
          df -h / | tail -1

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          # The binding's own source (talib.cpp) is in the key: a cached build of an older binding would keep its bugs.
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}

      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci

      # The TA network's tournament trains in PyTorch (CPU build: several times faster than the TypeScript trainer;
      # research/taNetTorch.ts). If this fails it trains in TypeScript (TA_NET_ENGINE=auto).
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: PyTorch (CPU)
        run: |
          python -m pip install --quiet numpy && python -m pip install --quiet torch --index-url https://download.pytorch.org/whl/cpu \
            && python -c "import torch; print('torch', torch.__version__)" || echo "PyTorch unavailable: the TA network trains in TypeScript"

      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"

      - name: Copy data from the server (read-only)
        id: pull
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"; mkdir -p "$DATA/recordings"
          # rsync exit 24: a file vanished during the copy (the live bot rotates its SNN checkpoints): not an error.
          vanished_ok() { local c=$?; [ $c -eq 24 ] && { echo "a few files changed on the server during the copy (rotated checkpoints): continuing"; return 0; }; return $c; }
          # Everything but recordings (copied below), logs and audit trails; nice'd on the server. Of the history walk
          # (history-walk.yml) only where it stands and its best network: the training starts from it.
          rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" --exclude 'recordings/' --exclude 'logs/' --exclude 'audit*' --exclude '*.log' --exclude '.venv*' --exclude '*.tmp' --exclude 'models/work/history-walk/*/pbt/' --exclude 'models/work/history-walk/*/replay-state/' bot:bot/data/ "$DATA/" || vanished_ok
          # Recordings: the last DAYS days of market data plus every other file. Today's and yesterday's are
          # still plain JSON lines: compressed in transit (level 1, cheap on the server's CPU).
          ssh bot "cd ~/bot/data/recordings && find . -type f \( ! -name 'md-*' -o -mtime -$DAYS \) -printf '%P\n'" > "$RUNNER_TEMP/recordings-all.txt"
          # From FROM_DAY on: a market-data day file (md-YYYY-MM-DD...) older than it is left on the server; every other file
          # is copied as before. The thin-book days were also most of the copy (53 of its 74 minutes on Nov 11).
          python3 - "$RUNNER_TEMP/recordings-all.txt" "$FROM_DAY" > "$RUNNER_TEMP/recordings.txt" <<'PY'
          import re, sys
          src, frm = sys.argv[1], sys.argv[2].strip()
          keep = drop = 0
          for line in open(src):
              m = re.search(r'(?:^|/)md-(\d{4}-\d{2}-\d{2})', line)
              if m and frm not in ('', 'none') and m.group(1) < frm:
                  drop += 1
                  continue
              keep += 1
              sys.stdout.write(line)
          print(f'recordings: {keep} file(s) copied, {drop} day file(s) before {frm} left on the server', file=sys.stderr)
          PY
          rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" --files-from="$RUNNER_TEMP/recordings.txt" bot:bot/data/recordings/ "$DATA/recordings/" || vanished_ok
          echo "copied $(wc -l < "$RUNNER_TEMP/recordings.txt") recording file(s); data $(du -sh "$DATA" | cut -f1)"
          # The server's settings without any credential, and without server paths (this runner has its own).
          ssh bot "grep -E '^[A-Z][A-Z0-9_]*=' ~/bot/bot.env" | grep -vE 'KEY|SECRET|TOKEN|PASSWORD|PRIVATE|PEM|CREDENTIAL|^BIND_HOST=|^ALLOW_NON_LOOPBACK|^PORT=' | grep -vE '^[A-Z0-9_]+=["'"'"']?(/|~)' > "$RUNNER_TEMP/train.env" || true
          echo "settings: $(wc -l < "$RUNNER_TEMP/train.env") line(s) from bot.env"
          df -h / | tail -1

      - name: Train
        id: train
        run: |
          # No -e (GitHub runs this with bash -e): a pipeline stopped by its time limit or the memory watchdog, a
          # failed step, or a failed checkpoint copy must not end the step before the next phase and the copy-back.
          set +e -uo pipefail
          DATA="$GITHUB_WORKSPACE/data"
          set -a; . "$RUNNER_TEMP/train.env"; set +a
          export DATA_DIR="$DATA" TRADING_MODE=paper AUTO_TRAIN=off
          export TA_NET_ENGINE="${TA_NET_ENGINE:-auto}" TA_NET_PYTHON="$(command -v python)"
          # The pipeline's heap: 8 GB of the runner's 16 (Node's default is about 4 GB: the quick run on Oct 21 ran out of
          # it, exit 134, before any step finished). The memory watchdog below still stops it before the runner runs out.
          export NODE_OPTIONS="--max-old-space-size=${PIPELINE_HEAP_MB:-8192}"
          # The TA network's rows (years of hourly bars for every coin) are computed on every core: 745,551 rows took
          # over 2 h on one thread on Oct 22. That step caps its threads by free memory itself (research/trainTaNet.ts
          # computeRowsInWorkers); the other steps keep TRAIN_WORKERS.
          export TA_ROW_WORKERS="${TA_ROW_WORKERS:-$(nproc)}"
          # The vol forecast, the dataset and the MLP candidate's backtest read the newest 4 recorded days: each replays
          # every day it reads (8 to 11 minutes a day here), and the quick phase must fit its time as the recordings
          # grow. A value in bot.env wins.
          export AUTO_TRAIN_DECISION_DAYS="${AUTO_TRAIN_DECISION_DAYS:-4}"
          # With the full-book limit on, the SNN, the MLP, the perps model and the vol model wait for FULL_MIN_DAYS recorded
          # days (meta plan v2, T1): the models in use stay until then, rather than retraining on two or three days.
          if [ -n "$FROM_DAY" ] && [ "$FROM_DAY" != none ]; then export AUTO_TRAIN_MIN_DAYS="$FULL_MIN_DAYS"; echo "recordings from $FROM_DAY; AUTO_TRAIN_MIN_DAYS=$AUTO_TRAIN_MIN_DAYS"; fi
          mkdir -p "$DATA/models/logs"
          LOG="$DATA/models/logs/pipeline-remote-$(date -u +%Y-%m-%dT%H-%M-%SZ).log"
          T0=$(date +%s)
          # The pipeline must stop 25 minutes before the job's 350-minute limit (timeout's 2-minute kill grace, the summary
          # and the copy-back to the server). left_min: minutes until then, never below 0.
          DEADLINE=$(( ${JOB_T0:-$T0} + (350 - 25) * 60 ))
          left_min() { local m=$(( (DEADLINE - $(date +%s)) / 60 - ${1:-0} )); [ "$m" -gt 0 ] && echo "$m" || echo 0; }
          echo "pipeline budget: $(left_min) minutes (server copy took $(( (T0 - ${JOB_T0:-$T0}) / 60 )))"
          # Copies the models (and this run's log) to the server: every 45 minutes while training, and after the
          # quick phase. Tournaments resume from these checkpoints; rebuildable caches stay here.
          sync_models() {
            rsync -a --bwlimit=8000 --whole-file --update --rsync-path="nice -n 19 rsync" --exclude '*.tmp' --exclude 'logs/' --exclude 'work/history-walk/' --exclude 'work/snnfill/' --exclude 'work/perp-dataset*/' --exclude 'work/perp-backtest-days/' --exclude 'work/sweep-replay/' --exclude 'work/vol-replay/' --exclude 'work/readiness-days/' --exclude 'work/playbook-days/' --exclude 'work/tanet-cache/' "$DATA/models/" bot:bot/data/models/ >/dev/null 2>&1; local c=$?
            rsync -a --bwlimit=8000 --whole-file --rsync-path="nice -n 19 rsync" "$LOG" bot:bot/data/models/logs/ >/dev/null 2>&1 || true
            case $c in 0|23|24) echo "checkpoint $(date -u +%H:%M): models copied to the server";; *) echo "checkpoint $(date -u +%H:%M): copy failed ($c), retried later";; esac
          }
          # One pipeline run under a time limit (minutes) and a memory watchdog. The runner has 16 GB; when the pipeline
          # used it all (Oct 13-20), GitHub shut the runner down and no later step ran, so nothing was copied back. Now
          # the pipeline is stopped (SIGTERM: it saves its progress) when less than 1.5 GB is left, and the job goes on.
          run_pipeline() {
            local minutes=$1; shift
            # timeout 0m would mean no limit at all: no time left = skipped like a stop at the limit.
            if [ "$minutes" -lt 1 ]; then echo "no time left for: $*"; return 124; fi
            timeout --signal=TERM --kill-after=2m "${minutes}m" node --import tsx research/pipeline.ts "$@" >> "$LOG" 2>&1 &
            local pid=$!
            ( while sleep 20; do
                avail=$(free -m | awk '/^Mem:/{print $7}')
                if [ "$avail" -lt 1500 ]; then echo "memory $(date -u +%H:%M): only $avail MB left, stopping the pipeline (progress saved) so the models get copied back"; kill -TERM $pid 2>/dev/null; break; fi
              done ) &
            local wd=$!
            wait $pid; local c=$?
            kill $wd 2>/dev/null || true
            # A crash, not a planned stop: the step it was in and the fatal error (step names and errors only: public repo).
            case $c in 0|124|137|143) ;; *) echo "pipeline exited with $c; its last steps:"; grep -E '^\[pipeline\] [A-Za-z0-9_-]+: (running|done in|skipped|FAILED)|FATAL ERROR|heap out of memory' "$LOG" | tail -12 | cut -c1-160;; esac
            return $c
          }
          ( while sleep 600; do echo "resources $(date -u +%H:%M): disk $(df -h / | awk 'NR==2{print $4}') free, memory $(free -m | awk '/^Mem:/{print $7}') MB available, swap used $(free -m | awk '/^Swap:/{print $3}') MB, largest $(ps -eo rss=,comm= --sort=-rss | head -1 | awk '{printf "%s %d MB", $2, $1/1024}')"; done ) &
          MON=$!
          ( while sleep 2700; do sync_models; done ) &
          SYNC=$!
          if [ -n "$ONLY" ]; then
            m=$(left_min); [ "$m" -gt 300 ] && m=300
            run_pipeline "$m" --only "$ONLY"; code=$?
          else
            # 1. The models trained on the bot's own recordings first, copied back at once, in two parts. The pipeline
            # runs its steps in a fixed order (vol_model, dataset, mlp, then perps, tennis, fill, sizing), and the first
            # three alone took 182 minutes on Oct 24 (33 + 33 + 116): in one 150-minute part the MLP was cut every day and
            # the four after it never ran. The short four go first (at most 75 minutes; tennis read 8 recorded days in 102
            # minutes on Oct 28 before it skipped the crypto books); the MLP's three get what is left of 260 minutes.
            # Limits are counted back from the deadline: the MLP's three end 40 minutes before it, so phase 2 always runs.
            # Meta plan v2 (T1): with the full-book limit on and fewer than FULL_MIN_DAYS full-book days copied, no step
            # that decides on recorded days runs (the pipeline's own DECISION_STEPS, plus the sweep and the SNN): the
            # models in use stay, rather than retraining on one or two days. Phase 2 still runs everything else.
            REC_STEPS=vol_model,dataset,mlp,tally_history,vol,perps,tennis,fill,session_risk,sizing,playbook,readiness,sweep,snn
            full=$(grep -cE '(^|/)md-[0-9]{4}-[0-9]{2}-[0-9]{2}' "$RUNNER_TEMP/recordings.txt" || true)
            SKIP=oracle_cull; first=0; quick=0
            if [ -n "$FROM_DAY" ] && [ "$FROM_DAY" != none ] && [ "$full" -lt "$FULL_MIN_DAYS" ]; then
              echo "only $full full-book day file(s) from $FROM_DAY (< $FULL_MIN_DAYS): steps on recorded days wait; the models in use stay"
              SKIP="oracle_cull,$REC_STEPS"
            else
              m=$(left_min 40); [ "$m" -gt 75 ] && m=75
              run_pipeline "$m" --only perps,tennis,fill,sizing; first=$?
              echo "quick phase, perps / tennis / fill / sizing: exit $first"; sync_models
              run_pipeline "$(left_min 40)" --only vol_model,dataset,mlp; quick=$?
              echo "quick phase, vol model / dataset / MLP: exit $quick"; sync_models
            fi
            case $quick in 0|124|137|143) quick=$first;; esac
            code=$quick
            # 2. Everything else until the deadline (at least 40 minutes). The oracle cull is left to the laptop
            # trainer: it builds TA rows for every coin over all of history (over 14 GB here) and runs weekly there; the TA
            # network and the Librarian read the oracle_cull.json the laptop sends.
            left=$(left_min)
            if [ "$left" -gt 20 ]; then run_pipeline "$left" --skip "$SKIP"; code=$?; fi
            # A failed step in the quick phase is not hidden by a second phase that finished.
            case $code in 0|124|137|143) case $quick in 0|124|137|143) ;; *) code=$quick;; esac;; esac
          fi
          kill $MON $SYNC 2>/dev/null || true
          echo "code=$code" >> "$GITHUB_OUTPUT"
          case $code in 0) echo "pipeline finished";; 124|137|143) echo "pipeline stopped by its time limit, the memory watchdog or a stop signal (progress saved; continues next run)";; *) echo "pipeline exited with $code";; esac

      - name: Summary (step names, promotions and counts only)
        if: always() && steps.pull.outcome == 'success'
        run: |
          python3 - "$GITHUB_WORKSPACE/data/models/reports" <<'PY'
          import glob, json, os, sys
          # Every report this run wrote (one per phase), not only the last: a promotion in the quick phase showed nowhere
          # before (meta plan v2, T0). A run that promotes nothing says so as a warning on the run's page.
          t0 = float(os.environ.get('JOB_T0') or 0)
          reps = sorted(f for f in glob.glob(os.path.join(sys.argv[1], 'pipeline-*.json')) if os.path.getmtime(f) >= t0)
          if not reps: print('no pipeline report'); sys.exit(0)
          promoted = []
          for rp in reps:
              r = json.load(open(rp))
              print(os.path.basename(rp), '| complete:', r.get('complete'), '| recorded days:', r.get('days'))
              for st in r.get('steps') or []:
                  d = st.get('detail') if isinstance(st.get('detail'), dict) else {}
                  state = 'skipped' if st.get('skipped') else 'error' if not st.get('ok') else 'promoted' if d.get('promoted') else 'done'
                  if state == 'promoted': promoted.append(str(st.get('step')))
                  print(f"  {st.get('step')}: {state} ({round((st.get('ms') or 0) / 60000, 1)} min)")
                  g = d.get('goLive')
                  if isinstance(g, dict): print(f"    go-live tally: {g.get('windows')} judged windows, {g.get('windowsTraded')} traded (each needs 1,000), over {g.get('days')} day(s)")
                  for src in ('recorded', 'history'):
                      p = (g or {}).get(src) if isinstance(g, dict) else None
                      if isinstance(p, dict): print(f"      {src}: {p.get('nWindows')} windows, {p.get('windowsTraded')} traded, P&L ${p.get('pnl')}, over {p.get('days')} day(s)")
          print('promoted this run:', ', '.join(promoted) if promoted else 'nothing')
          if not promoted: print('::warning title=Remote training::no model was promoted this run')
          PY

      - name: Copy models and history back to the server
        if: always() && steps.pull.outcome == 'success'
        run: |
          set -euo pipefail
          DATA="$GITHUB_WORKSPACE/data"
          # --update: never overwrite a file that is newer on the server. The history walk's folder is the walk's own.
          rsync -a --bwlimit=8000 --whole-file --update --rsync-path="nice -n 19 rsync" --exclude 'work/tanet-cache/torch-pack/' --exclude 'work/history-walk/' "$DATA/models/" bot:bot/data/models/
          [ -d "$DATA/history" ] && rsync -a --bwlimit=8000 --whole-file --update --rsync-path="nice -n 19 rsync" "$DATA/history/" bot:bot/data/history/ || true
          echo "models and history copied back; the bot hot-swaps what changed"

      - name: Fail on a pipeline error
        if: steps.train.outputs.code != '' && steps.train.outputs.code != '0' && steps.train.outputs.code != '124' && steps.train.outputs.code != '137' && steps.train.outputs.code != '143'
        run: exit 1
