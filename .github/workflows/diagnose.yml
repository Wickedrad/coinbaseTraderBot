  # One-time repair of the Kalshi history stored on the server (Steven's go, Oct 31): markets from Kalshi's /historical
  # endpoint were saved with quotes 100x too small until PR #217. Writes only data/history/kalshi day files, through a
  # temp file and a rename; the bot's own state is not touched. Prints counts, posted as a comment on the commit.
  adversary:
    if: inputs.atlas_archive_export != 'true' && inputs.atlas_drive_inventory != 'true' && inputs.atlas_inventory != 'true' && inputs.adversary == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the last 8 days of the audit log and the latest replay check (read-only, 8 MB/s)
        run: |
          set -euo pipefail
          mkdir -p data/audit
          since=$(date -u -d '7 days ago' +%F)
          ssh bot 'ls -1 ~/bot/data/audit/' | grep -E '^audit-[0-9-]{10}' | awk -v s="audit-$since" '$0 >= s' > "$RUNNER_TEMP/audit.txt"
          echo "$(wc -l < "$RUNNER_TEMP/audit.txt") audit files"
          rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" --files-from="$RUNNER_TEMP/audit.txt" bot:bot/data/audit/ data/audit/
          for f in data/audit/*.gz; do [ -e "$f" ] && gunzip -f "$f"; done
          rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" bot:bot/data/models/sweeps/replay-check-latest.json data/ 2>/dev/null || echo "no replay check verdict on the server"
          # data-lag and feed-drop warnings of the last day (times only)
          ssh bot 'journalctl -u kalshi-bot --since "25 hours ago" --no-pager -o short-iso-precise 2>/dev/null | grep -E "behind real time|kalshi-ws\] closed|feed down" | cut -d" " -f1' > data/lags.txt || true
          echo "$(wc -l < data/lags.txt) lag / feed-drop warnings"
          # The take-profit settings the bot runs with (guards.takeProfit from /api/status); only that object leaves the box.
          # The dashboard password is read on the server and handed to curl on stdin, never printed.
          ssh bot bash -s <<'SH' | python3 -c 'import json,sys; print(json.dumps((json.load(sys.stdin).get("guards") or {}).get("takeProfit") or {}))' > data/takeprofit.json || echo '{}' > data/takeprofit.json
          PW=$(sed -n 's/^DASHBOARD_PASSWORD=//p' ~/bot/bot.env 2>/dev/null | tail -1 | tr -d '\r')
          case "$PW" in \"*\") PW=${PW#\"}; PW=${PW%\"};; esac
          if [ -n "$PW" ]; then printf 'Authorization: Bearer %s\n' "$PW" | curl -s -m 20 -H @- http://localhost:3000/api/status; else curl -s -m 20 http://localhost:3000/api/status; fi
          SH
          echo "take-profit settings: $(cat data/takeprofit.json)"
      - name: Adversary report
        run: python3 deploy/adversary_report.py data 24 data/lags.txt

  kalshi-repair:
    if: inputs.atlas_archive_export != 'true' && inputs.atlas_drive_inventory != 'true' && inputs.atlas_inventory != 'true' && inputs.kalshi_repair == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Upload the repair script
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: deploy/kalshi_cents_repair.py
          target: /tmp/kalshi-repair-${{ github.run_id }}
      - name: Repair
        id: repair
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          command_timeout: 25m
          capture_stdout: true
          script: |
            S=/tmp/kalshi-repair-${{ github.run_id }}/deploy/kalshi_cents_repair.py
            cd ~
            DIRS=$(find . -maxdepth 6 -type d -path '*/history/kalshi' -not -path '*/node_modules/*' 2>/dev/null | sort)
            echo "== Kalshi history stores found: $(echo "$DIRS" | grep -c . || true)"
            [ -z "$DIRS" ] && exit 0
            echo "== before"; nice -n 19 ionice -c3 python3 "$S" --dry-run $DIRS
            echo "== repair"; nice -n 19 ionice -c3 python3 "$S" $DIRS
            echo "== after (should be 0)"; nice -n 19 ionice -c3 python3 "$S" --dry-run $DIRS
            rm -rf /tmp/kalshi-repair-${{ github.run_id }}
      - name: Post the counts on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          OUT: ${{ steps.repair.outputs.stdout }}
        run: |
          { echo "Kalshi quote repair, run ${{ github.run_id }} (${{ job.status }})"; echo; echo '```'; printf '%s\n' "$OUT" | tail -40; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"

  # The TA contract study (the TA network review, Oct 29): does TA on the spot candles beat the fair value, and Kalshi's
  # mid, at the 15-minute contract's own question? Runs on this runner from Binance's public archives; the server is not
  # touched. The history and the replay days are cached between runs (keyed by coins and days), so a wider range only
  # builds what is new. Prints aggregates only (counts, log losses, the chosen set): this repository is public.
  ta-study:
    if: inputs.atlas_archive_export != 'true' && inputs.atlas_drive_inventory != 'true' && inputs.atlas_inventory != 'true' && inputs.ta_study == 'true'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 340
    # The log's tail is posted as a comment on the dispatched commit (contents: write): the job-log host is not
    # reachable from every place the study is read from.
    permissions:
      contents: write
    concurrency:
      group: ta-contract-study
      cancel-in-progress: false
    env:
      TA_FROM: ${{ inputs.ta_from }}
      TA_TO: ${{ inputs.ta_to }}
      TA_ASSETS: ${{ inputs.ta_assets || 'BTC,ETH,SOL,XRP,DOGE' }}
      NODE_OPTIONS: --max-old-space-size=12288
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci
      - name: Cache key (a cache key may not contain commas)
        id: key
        run: echo "coins=$(printf '%s' "$TA_ASSETS" | tr ',' '-')" >> "$GITHUB_OUTPUT"
      # Restore and save are separate steps so the hours of replay days are kept even when the study itself fails.
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      # The raw history (raw/history, shared with the Kalshi sweep) and the built replay days (simulated/ta-study) live on
      # Drive; each run adds what is new.
      - name: Restore the 1-minute history and the replay days from Drive
        id: drive
        run: |
          if bash deploy/drive_lab.sh get raw/history data/history --include '/binance-1m/**' --include '/binance/**' --include '/kalshi/**' && bash deploy/drive_lab.sh get simulated/ta-study data/ta-study-replay; then
            echo "hit=true" >> "$GITHUB_OUTPUT"; du -sh data/history data/ta-study-replay 2>/dev/null | cat
          else echo "not all on Drive yet: falling back to the newest cache"; fi
      - name: Restore the 1-minute history and the replay days (cache fallback)
        if: steps.drive.outputs.hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/history/binance-1m
            data/history/binance
            data/history/kalshi
            data/ta-study-replay
          key: ta-study-${{ steps.key.outputs.coins }}-${{ inputs.ta_from }}-${{ inputs.ta_to }}-${{ github.run_id }}
          restore-keys: |
            ta-study-${{ steps.key.outputs.coins }}-${{ inputs.ta_from }}-${{ inputs.ta_to }}-
            ta-study-${{ steps.key.outputs.coins }}-
            ta-study-
      - name: SSH to the server (dominance series)
        if: inputs.ta_dominance == 'true'
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the BTC.D / USDT.D series from the server (read-only)
        if: inputs.ta_dominance == 'true'
        run: |
          set -euo pipefail
          mkdir -p data/history
          rsync -a --rsync-path="nice -n 19 rsync" --include='/tradingview/' --include='/binance-index/' --include='/bot-index/' --include='/*/BTC.D/***' --include='/*/USDT.D/***' --exclude='*' bot:bot/data/history/ data/history/
          echo "dominance files: $(find data/history -path '*BTC.D*' -o -path '*USDT.D*' | grep -c . || true)"
      - name: Run the study
        id: study
        run: |
          set -euo pipefail
          args=(--assets "$TA_ASSETS")
          [ -n "$TA_FROM" ] && args+=(--from "$TA_FROM")
          [ -n "$TA_TO" ] && args+=(--to "$TA_TO")
          [ "${{ inputs.ta_rebuild }}" = "true" ] && args+=(--rebuild-replay)
          set +e
          node --import tsx research/taContractStudy.ts "${args[@]}" 2>&1 | grep --line-buffered -vE '^\s*$' | tee "$RUNNER_TEMP/ta-study.log" | tail -400
          c=${PIPESTATUS[0]}
          echo "exit=$c" >> "$GITHUB_OUTPUT"
          exit $c
      - name: Keep the history and the replay days on Drive
        if: always()
        run: |
          set -euo pipefail
          bash deploy/drive_lab.sh put raw/history data/history --include '/binance-1m/**' --include '/binance/**' --include '/kalshi/**'
          [ ! -d data/ta-study-replay ] || bash deploy/drive_lab.sh put simulated/ta-study data/ta-study-replay
      - name: Post the log's tail on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "TA contract study run ${{ github.run_id }} (${TA_ASSETS}, ${TA_FROM:-auto}..${TA_TO:-auto}): exit ${{ steps.study.outputs.exit || 'none' }}"; echo; echo '```'; grep -vE 'binance:|replay: 20|rows: [0-9]+ so far' "$RUNNER_TEMP/ta-study.log" 2>/dev/null | head -40; echo '[...]'; tail -c 56000 "$RUNNER_TEMP/ta-study.log" 2>/dev/null | tail -150; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ta-contract-study-report
          path: research/out/ta-contract-study/report.json
          if-no-files-found: ignore
