# Whole-bot round dispatcher (meta plan thread). Lives only on the round branch: a push that changes the queue file
# starts it. It dispatches kalshi-replay-check comparison arms on this branch, at most CAP at a time (the project's
# runner rationing), skipping arms that already ran or are running, and waits until every queued arm is dispatched.
# Queue lines: <tag> <day> <reuse run> <overrides...>   (24 h stretch from <day> 15:40 UTC; REPLAY_NOTE added here)
name: Whole-bot round dispatcher
on:
  push:
    branches: [claude/whole-bot-r2]
    paths: ['.github/wb-queue.txt']
permissions:
  actions: write
  contents: read
concurrency:
  group: wb-round-dispatcher
  cancel-in-progress: true
jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      R: ${{ github.repository }}
      BR: ${{ github.ref_name }}
      NOTE: wb-r2
      CAP: '3'
    steps:
      - uses: actions/checkout@v5
      - name: Dispatch the queue
        run: |
          set -uo pipefail
          WF=kalshi-replay-check.yml
          runs() { gh api "repos/$R/actions/workflows/$WF/runs?per_page=100&branch=$BR" --jq '.workflow_runs[] | "\(.status) \(.conclusion) \(.display_title)"' < /dev/null; }
          # Both rounds' replays (any branch) count against this thread's cap of 10.
          active() { gh api "repos/$R/actions/workflows/$WF/runs?per_page=100" --jq '.workflow_runs[] | "\(.status) \(.display_title)"' < /dev/null | grep -c "^\(queued\|in_progress\|pending\|waiting\|requested\) .*REPLAY_NOTE=wb-r" || true; }
          # No grep -q here: under pipefail an early grep -q exit SIGPIPEs the writer and reads as "not found" (that re-ran finished arms).
          done_or_running() { local all; all=$(runs) || return 1; [ "$(printf '%s\n' "$all" | grep -E "^(queued|in_progress|pending|waiting|requested) |^completed success " | grep -c "REPLAY_TAG=$1 .*REPLAY_NOTE=$NOTE")" -gt 0 ]; }
          while read -r tag day reuse ov; do
            [ -z "$tag" ] || [[ "$tag" == \#* ]] && continue
            if done_or_running "$tag"; then echo "skip $tag (ran or running)"; continue; fi
            while [ "$(active)" -ge "$CAP" ]; do sleep 60; done
            next=$(date -u -d "$day +1 day" +%F)
            # REPLAY_WARMUP_HOURS=<h> among the overrides: the replay starts h hours before the stretch (learned state such as the
            # market anchor and the accuracy gate warm up on the days before), so the copy's days from then on are listed.
            wh=$(sed -nE 's/.*REPLAY_WARMUP_HOURS=([0-9]+).*/\1/p' <<< "$ov"); first=$(date -u -d "${day}T15:40:00Z - ${wh:-8} hours" +%F)
            dlist=""; d=$first; while [[ "$d" < "$next" || "$d" == "$next" ]]; do dlist="${dlist:+$dlist,}$d"; d=$(date -u -d "$d +1 day" +%F); done
            # A dispatch can fail with a transient HTTP 5xx: retry, and never let gh read the queue (stdin).
            for try in 1 2 3 4 5; do
              gh workflow run $WF -R "$R" --ref "$BR" -f reuse_run="$reuse" -f days="$dlist" -f from="${day}T15:40:00Z" -f to="${next}T15:40:00Z" \
                -f nearby=none -f overrides="REPLAY_TAG=$tag $ov REPLAY_NOTE=$NOTE" < /dev/null && break
              echo "dispatch of $tag failed (try $try), retrying"; sleep $((try * 30))
            done
            echo "$(date -u +%H:%M) dispatched $tag"; sleep 30
          done < .github/wb-queue.txt
          echo "queue dispatched"
