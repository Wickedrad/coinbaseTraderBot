name: Opportunity Atlas observed recordings (GitHub only)

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Earlier public-prefix run, or comma-separated completed Oracle-edge runs when oracle_edge=true to assess without recollection'
        default: ''
        required: false
      study_run:
        description: 'Optional completed atlas-recording-study run; refit its frozen datasets without archive processing or SNN replay'
        default: ''
        required: false
      expand_training:
        description: 'Add fixed October 24 and 27 archive prefixes to exercise non-prior fits; preserves the plan, audit and final holdout'
        type: boolean
        default: false
        required: false
      movement_only:
        description: 'With study_run, learn advance movement from its inputs; ignores settlement outcomes and preserves the live profit pacer'
        type: boolean
        default: false
        required: false

      direction_iterations:
        description: "Train direction-only native weights, continuous small-move decoders and separate $200 snapshot paper accounts from cached artifacts"
        type: boolean
        default: false
        required: false
      direction_snapshot_run:
        description: 'Optional completed atlas-direction-snapshots run; reuse its exact receipt-checked inputs'
        default: ''
        required: false
      direction_snapshot_only:
        description: 'Prepare the receipt-checked snapshot/trade inputs only; reuse them after the native study finishes'
        type: boolean
        default: false
        required: false
      paper_native_run:
        description: 'Optional completed atlas-native-direction run; reuse its actual weights for cash paper replay without retraining'
        default: ''
        required: false
      oracle_edge:
        description: 'Publish frozen Oracle forecasts and verify future prices and separate $200 paper controls; public GET only, tvdatafeed history only'
        type: boolean
        default: false
        required: false
      edge_cycles:
        description: 'Minute cycles: 2 for a data probe, 72 for both 15m and 1h outcomes; 2..90'
        default: '72'
        required: false

permissions:
  contents: read
  actions: read

jobs:
  public-prefix:
    if: ${{ !inputs.oracle_edge && inputs.study_run == '' && (inputs.source_run == '' || inputs.expand_training) }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        day: ${{ fromJSON(inputs.source_run != '' && '["2026-10-24","2026-10-27"]' || inputs.expand_training && '["2026-10-22","2026-10-24","2026-10-27","2026-10-29","2026-11-01","2026-11-04","2026-11-06","2026-11-07"]' || '["2026-10-22","2026-10-29","2026-11-01","2026-11-04","2026-11-06","2026-11-07"]') }}
    steps:
      - uses: actions/checkout@v5
      - name: Read a fixed bounded prefix from already archived market recordings
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
          RECORDING_DAY: ${{ matrix.day }}
        run: |
          set -euo pipefail
          test -n "$RCLONE_CONF"
          if ! command -v rclone >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq rclone
          fi
          cfg=$(mktemp -d "$RUNNER_TEMP/atlas-public-XXXXXX")
          chmod 700 "$cfg"
          trap 'rm -rf "$cfg"' EXIT
          export RCLONE_CONFIG="$cfg/rclone.conf"
          printf '%s\n' "$RCLONE_CONF" > "$RCLONE_CONFIG"
          chmod 600 "$RCLONE_CONFIG"
          rclone cat "gdrive:kalshi-bot-archive/recordings/md-$RECORDING_DAY.jsonl.gz" --head 134217728 > "$cfg/prefix.gz"
          mkdir -p research/out/atlas-public-recordings
          python3 -B research/opportunity/recordingPrefix.py "$cfg/prefix.gz" \
            --out "research/out/atlas-public-recordings/md-$RECORDING_DAY.jsonl.gz" \
            --report "research/out/atlas-public-recordings/public-$RECORDING_DAY.json" \
            --max-decompressed-mib 4096 --book-every-ms 0 --observed-only
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-public-${{ matrix.day }}
          path: research/out/atlas-public-recordings/
          retention-days: 7
          if-no-files-found: error
  contract-study:
    needs: public-prefix
    if: ${{ !cancelled() && !inputs.oracle_edge && inputs.study_run == '' && (needs.public-prefix.result == 'success' || (needs.public-prefix.result == 'skipped' && inputs.source_run != '')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      REPLAY_EXCLUDE: ''
      SNN_BACKFILL_DIR: ''
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        if: needs.public-prefix.result == 'success'
        with:
          pattern: atlas-public-*
          path: ${{ runner.temp }}/atlas-recordings
          merge-multiple: true
      - uses: actions/download-artifact@v4
        if: inputs.source_run != ''
        with:
          pattern: atlas-public-*
          path: ${{ runner.temp }}/atlas-recordings
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Register and run the observed contract and S5/S6 engineering study
        run: |
          node --import tsx research/opportunity/runRecordingStudy.ts --recordings "$RUNNER_TEMP/atlas-recordings" \
            --out research/out/atlas-recording-study
      - name: Save study, provenance and paper abstention evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: atlas-recording-study
          path: research/out/atlas-recording-study/
          if-no-files-found: warn
          retention-days: 90
  refit-study:
    if: inputs.study_run != '' && !inputs.direction_iterations && !inputs.oracle_edge
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      OMP_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: atlas-recording-study
          path: ${{ runner.temp }}/atlas-recording-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.study_run }}
      - name: Refit only the verified datasets and evaluate their locked paper queries
        if: ${{ !inputs.movement_only }}
        run: |
          node --import tsx research/opportunity/refitRecordingStudy.ts --source "$RUNNER_TEMP/atlas-recording-source" \
            --out research/out/atlas-recording-refit
      - name: Learn advance movement independently of settlement and quoted payouts
        if: inputs.movement_only
        run: |
          npm run research:opportunity-movement -- run --source "$RUNNER_TEMP/atlas-recording-source" \
            --out research/out/atlas-movement-study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ inputs.movement_only && 'atlas-movement-study' || 'atlas-recording-refit' }}
          path: ${{ inputs.movement_only && 'research/out/atlas-movement-study/' || 'research/out/atlas-recording-refit/' }}
          if-no-files-found: warn
          retention-days: 90
  snapshots:
    if: inputs.direction_iterations && inputs.study_run != '' && inputs.source_run != '' && inputs.direction_snapshot_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPLAY_EXCLUDE: ''
      SNN_BACKFILL_DIR: ''
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-public-*
          path: ${{ runner.temp }}/prefixes
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-public-*
          path: ${{ runner.temp }}/prefixes
          merge-multiple: true
          github-token: ${{ github.token }}
          run-id: ${{ inputs.study_run }}
      - name: Build fresh-snapshot decisions without consuming deltas or settlement labels
        run: |
          node --import tsx research/opportunity/prepareDirectionSnapshots.ts \
            --recordings "$RUNNER_TEMP/prefixes" --out research/out/atlas-direction-snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: atlas-direction-snapshots
          path: research/out/atlas-direction-snapshots/
          retention-days: 90
          if-no-files-found: error
  native-direction:
    needs: snapshots
    if: ${{ !cancelled() && inputs.direction_iterations && !inputs.direction_snapshot_only && inputs.paper_native_run == '' && inputs.study_run != '' && (needs.snapshots.result == 'success' || inputs.direction_snapshot_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      OMP_NUM_THREADS: '2'
      REPLAY_EXCLUDE: ''
      SNN_BACKFILL_DIR: ''
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: atlas-recording-study
          path: ${{ runner.temp }}/source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.study_run }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-direction-snapshots
          path: ${{ runner.temp }}/snapshots
          github-token: ${{ github.token }}
          run-id: ${{ inputs.direction_snapshot_run != '' && inputs.direction_snapshot_run || github.run_id }}
      - name: Train native S5/S6 and continuous small-move decoders; freeze before later periods
        run: |
          node --import tsx research/opportunity/runNativeDirectionStudy.ts \
            --source "$RUNNER_TEMP/source" --snapshots "$RUNNER_TEMP/snapshots" --out research/out/atlas-native-direction
      - name: Replay separate $200 accounts on observed contract snapshots
        run: |
          node --import tsx research/opportunity/runDirectionPaperStudy.ts \
            --native research/out/atlas-native-direction --snapshots "$RUNNER_TEMP/snapshots" --out research/out/atlas-direction-paper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-native-direction
          path: research/out/atlas-native-direction/
          retention-days: 90
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-direction-paper
          path: research/out/atlas-direction-paper/
          retention-days: 90
          if-no-files-found: warn
  cash-paper-only:
    needs: snapshots
    if: ${{ !cancelled() && inputs.direction_iterations && inputs.paper_native_run != '' && (needs.snapshots.result == 'success' || inputs.direction_snapshot_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: atlas-native-direction
          path: ${{ runner.temp }}/native
          github-token: ${{ github.token }}
          run-id: ${{ inputs.paper_native_run }}
      - uses: actions/download-artifact@v4
        with:
          name: atlas-direction-snapshots
          path: ${{ runner.temp }}/snapshots
          github-token: ${{ github.token }}
          run-id: ${{ inputs.direction_snapshot_run != '' && inputs.direction_snapshot_run || github.run_id }}
      - name: Replay $200 accounts with actual printed-trade maker exits and snapshot taker exits
        run: |
          node --import tsx research/opportunity/runDirectionPaperStudy.ts --native "$RUNNER_TEMP/native" \
            --snapshots "$RUNNER_TEMP/snapshots" --out research/out/atlas-direction-paper
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-direction-paper
          path: research/out/atlas-direction-paper/
          retention-days: 90
          if-no-files-found: warn
  frozen-oracle-edge:
    if: inputs.oracle_edge && inputs.source_run == ''
    runs-on: ubuntu-latest
    timeout-minutes: 140
    env:
      EDGE_CYCLES: ${{ inputs.edge_cycles }}
      NODE_OPTIONS: --max-old-space-size=4096
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - name: Install the existing tvdatafeed bridge on this GitHub runner
        run: python -m pip install --quiet 'tvdatafeed @ https://github.com/rongardF/tvdatafeed/archive/refs/heads/main.zip'
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-oracle-result-*
          path: ${{ runner.temp }}/oracle-models
          github-token: ${{ github.token }}
          run-id: '42643723640'
      - uses: actions/download-artifact@v4
        with:
          pattern: atlas-oracle-importance-*
          path: ${{ runner.temp }}/oracle-weights
          github-token: ${{ github.token }}
          run-id: '42667008829'
      - name: Register and publish frozen forecasts before observing their outcomes
        run: |
          node --import tsx research/opportunity/oracleEdgeCli.ts --models "$RUNNER_TEMP/oracle-models" \
            --weights "$RUNNER_TEMP/oracle-weights" --cycles "$EDGE_CYCLES" --out research/out/atlas-oracle-edge
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-oracle-edge
          path: research/out/atlas-oracle-edge/
          retention-days: 90
          if-no-files-found: warn
  assess-oracle-edge:
    needs: frozen-oracle-edge
    if: ${{ !cancelled() && inputs.oracle_edge && ((needs.frozen-oracle-edge.result == 'success' && fromJSON(inputs.edge_cycles) >= 65) || inputs.source_run != '') }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    env:
      EDGE_RUNS: ${{ inputs.source_run != '' && inputs.source_run || github.run_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Audit registered forward forecasts, observed fills, fee accounting and stressed incremental profit
        run: |
          node --import tsx --input-type=module <<'JS'
          import fs from 'node:fs';
          import path from 'node:path';
          import { execFileSync } from 'node:child_process';
          import { aggregateOracleEdge } from './research/opportunity/oracleEdgeAggregate.ts';
          const ids = process.env.EDGE_RUNS.split(',').map(s => s.trim());
          if (!ids.length || ids.length > 30 || new Set(ids).size !== ids.length || ids.some(id => !/^\d+$/.test(id))) throw Error('Supply 1..30 unique completed run IDs');
          const dirs = [], provenance = [];
          for (const id of ids) {
            const dir = path.join(process.env.RUNNER_TEMP, 'oracle-edge-trials', id);
            // Automatic assessment shares the collector's run: its artifact is already uploaded.
            // Waiting for that same run would wait for this assessment itself.
            if (id !== process.env.GITHUB_RUN_ID) execFileSync('gh', ['run','watch',id,'--repo',process.env.GITHUB_REPOSITORY,'--interval','30'], {stdio:'inherit'});
            execFileSync('gh', ['run','download',id,'--repo',process.env.GITHUB_REPOSITORY,'--name','atlas-oracle-edge','--dir',dir], {stdio:'inherit'});
            const meta = JSON.parse(execFileSync('gh',['api',`repos/${process.env.GITHUB_REPOSITORY}/actions/runs/${id}`],{encoding:'utf8'}));
            provenance.push({id,headSha:meta.head_sha,startedAt:meta.run_started_at,conclusion:meta.conclusion}); dirs.push(dir);
          }
          const assessment = await aggregateOracleEdge(dirs);
          fs.mkdirSync('research/out/atlas-oracle-edge-assessment',{recursive:true});
          fs.writeFileSync('research/out/atlas-oracle-edge-assessment/report.json',JSON.stringify({...assessment,provenance},null,2)+'\n');
          console.log(JSON.stringify(assessment.assessment));
          JS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-oracle-edge-assessment
          path: research/out/atlas-oracle-edge-assessment/
          retention-days: 90
          if-no-files-found: warn
