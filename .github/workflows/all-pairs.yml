# All-pairs entry/exit payoff matrices (python/allpairs; Steven, 2026-11-05): every entry minute against every exit
# minute and settlement of each 15-minute Kalshi window, net of the real fees, maker and taker fills; a Snell-envelope
# (Longstaff-Schwartz) exit policy; entry labels that follow it; purged walk-forward folds split over runners; a deflated
# Sharpe gate with placebo, stress and synthetic-pricer arms. The card is posted on the commit.
#
# Data: Google Drive raw/history (Kalshi's own 1-minute candles of the 15-minute series and Binance 1-minute bars, the
# 200-day history), read-only; results and the trial ledger go to Drive models/all-pairs. No server access at all.
# DOGE is never loaded (Steven, Nov 5). The repository is public: only aggregates are printed or uploaded.
name: All-pairs matrix

on:
  # A new workflow can't be dispatched until it is on main: while on its branch, a push whose commit message has
  # "[all-pairs]" runs the study, "[all-pairs-report:<run id>]" re-runs only the card on that run's parts; any other
  # push of these files runs the unit tests only.
  push:
    branches: [claude/project-thread-eqduzm]
    paths: ['.github/workflows/all-pairs.yml', 'python/allpairs/**']
  workflow_dispatch:
    inputs:
      config:
        description: 'Hypothesis config under python/allpairs/hypotheses/ (the candidate, without .json)'
        required: false
        default: 'base'
      arms:
        description: 'Arms to run: base,stress,synth15,synth1h (base always runs)'
        required: false
        default: 'base,stress,synth15,synth1h'
      days:
        description: 'Most recent N days of history (0 = all on Drive)'
        required: false
        default: '0'

permissions:
  contents: read

# A new study cancels the branch's running study; a tests-only push cancels only tests-only runs.
concurrency:
  group: all-pairs-${{ github.ref }}-${{ inputs.config || 'base' }}-${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[all-pairs]') }}
  cancel-in-progress: true

env:
  ASSETS: BTC,ETH,SOL,XRP
  PYTHONUNBUFFERED: '1'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      study: ${{ steps.go.outputs.study }}
      matrix: ${{ steps.go.outputs.matrix }}
      report_run: ${{ steps.go.outputs.report_run }}
      diag: ${{ steps.go.outputs.diag }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/allpairs/requirements.txt
      - run: pip install --quiet -r python/allpairs/requirements.txt
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Unit tests
        working-directory: python
        run: |
          set -o pipefail
          python -W ignore -m unittest discover -s allpairs/tests -t . 2>&1 | tail -20
      - name: Plan the jobs
        id: go
        env:
          MSG: ${{ github.event.head_commit.message }}
          EVENT: ${{ github.event_name }}
          ARMS_IN: ${{ inputs.arms || 'base,stress,synth15,synth1h' }}
        run: |
          set -euo pipefail
          # A push may name its arms in the commit message: [arms:base,stress]
          ARMS=$(printf '%s' "$MSG" | sed -nE 's/.*\[arms:([a-z0-9,]+)\].*/\1/p' | head -1)
          ARMS=${ARMS:-$ARMS_IN}
          if [ "$EVENT" = "workflow_dispatch" ] || printf '%s' "$MSG" | grep -qF '[all-pairs]'; then echo "study=true" >> "$GITHUB_OUTPUT"; else echo "study=false" >> "$GITHUB_OUTPUT"; fi
          if printf '%s' "$MSG" | grep -qF '[all-pairs-diag]'; then echo "diag=true" >> "$GITHUB_OUTPUT"; else echo "diag=false" >> "$GITHUB_OUTPUT"; fi
          rr=$(printf '%s' "$MSG" | sed -nE 's/.*\[all-pairs-report:([0-9]+)\].*/\1/p' | head -1)
          echo "report_run=$rr" >> "$GITHUB_OUTPUT"
          # 9 study jobs, at most 5 at once (the project shares ~50 runners): base folds over 4, stress and synth1h over 2.
          python3 - "$ARMS" >> "$GITHUB_OUTPUT" <<'EOF'
          import json, sys
          want = {a.strip() for a in sys.argv[1].split(',') if a.strip()} | {'base'}
          parts = {'base': 4, 'stress': 2, 'synth15': 1, 'synth1h': 2}
          inc = [{'arm': a, 'part': p, 'parts': n} for a, n in parts.items() if a in want for p in range(n)]
          print('matrix=' + json.dumps({'include': inc}))
          EOF

  diag:
    needs: test
    if: needs.test.outputs.diag == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/allpairs/requirements.txt
      - run: pip install --quiet -r python/allpairs/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Data-quality report of the Kalshi candles
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          args=()
          for a in ${ASSETS//,/ }; do [ "$a" = "DOGE" ] || args+=(--include "/kalshi/KX${a}15M/*.jsonl"); done
          bash deploy/drive_lab.sh get raw/history data/history "${args[@]}"
          (cd python && python -W ignore -m allpairs.diag --history ../data/history --assets "$ASSETS") | tee "$RUNNER_TEMP/diag.txt"
          { echo "All-pairs data diagnostics, run ${{ github.run_id }}"; echo; echo '```'; cut -c1-700 "$RUNNER_TEMP/diag.txt"; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"

  study:
    needs: test
    if: needs.test.outputs.study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 340
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix: ${{ fromJSON(needs.test.outputs.matrix) }}
    name: study (${{ matrix.arm }} ${{ matrix.part }}/${{ matrix.parts }})
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/allpairs/requirements.txt
      - run: pip install --quiet -r python/allpairs/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Kalshi 15-minute candles and Binance 1-minute bars from Drive (no DOGE)
        run: |
          set -euo pipefail
          args=()
          for a in ${ASSETS//,/ }; do
            [ "$a" = "DOGE" ] && continue
            args+=(--include "/kalshi/KX${a}15M/*.jsonl" --include "/binance-1m/${a}/1m.csv")
          done
          bash deploy/drive_lab.sh get raw/history data/history "${args[@]}"
          du -sh data/history/kalshi data/history/binance-1m | cat
          for d in data/history/kalshi/*; do echo "$(basename "$d"): $(ls "$d" | wc -l) day files, $(cat "$d"/*.jsonl | wc -l) markets"; done
      - name: Run ${{ matrix.arm }} part ${{ matrix.part }}
        working-directory: python
        env:
          CONFIG: ${{ inputs.config || 'base' }}
          DAYS: ${{ inputs.days || '0' }}
        run: |
          set -euo pipefail
          [[ "$CONFIG" =~ ^[A-Za-z0-9_-]+$ ]] && [[ "$DAYS" =~ ^[0-9]+$ ]] || { echo "bad input"; exit 1; }
          python -W ignore -m allpairs.run --history ../data/history --config "allpairs/hypotheses/$CONFIG.json" \
            --arm ${{ matrix.arm }} --part ${{ matrix.part }} --parts ${{ matrix.parts }} --assets "$ASSETS" --days "$DAYS" \
            --out "$RUNNER_TEMP/parts/${{ matrix.arm }}-${{ matrix.part }}.json" 2>&1 | tail -80
      - name: Keep the part (aggregates only)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: part-${{ matrix.arm }}-${{ matrix.part }}
          path: ${{ runner.temp }}/parts/
          retention-days: 7
          if-no-files-found: ignore

  report:
    needs: [test, study]
    if: always() && (needs.test.outputs.study == 'true' || needs.test.outputs.report_run != '')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/allpairs/requirements.txt
      - run: pip install --quiet -r python/allpairs/requirements.txt
      - uses: actions/download-artifact@v4
        with:
          pattern: part-*
          path: ${{ runner.temp }}/parts
          run-id: ${{ needs.test.outputs.report_run || github.run_id }}
          github-token: ${{ github.token }}
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Combine the parts, gate, card
        working-directory: python
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/state" "$RUNNER_TEMP/results"
          bash ../deploy/drive_lab.sh get models/all-pairs/state "$RUNNER_TEMP/state" || echo "no ledger on Drive yet"
          ls -R "$RUNNER_TEMP/parts" | head -30
          python -W ignore -m allpairs.run combine --parts "$RUNNER_TEMP/parts" --out "$RUNNER_TEMP/results"
          python -W ignore -m allpairs.report --results "$RUNNER_TEMP/results" --ledger "$RUNNER_TEMP/state/trials.jsonl" \
            --champion "$RUNNER_TEMP/state/champion.json" --card "$RUNNER_TEMP/results/card.md" --run-url "$RUN_URL" --run-id "${{ github.run_id }}"
      - name: Keep results and the ledger on Drive
        if: always()
        run: |
          [ ! -d "$RUNNER_TEMP/results" ] || bash deploy/drive_lab.sh put "models/all-pairs/runs/${{ github.run_id }}" "$RUNNER_TEMP/results"
          [ ! -f "$RUNNER_TEMP/state/trials.jsonl" ] || bash deploy/drive_lab.sh put models/all-pairs/state "$RUNNER_TEMP/state"
      - name: Post the card on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "All-pairs matrix run ${{ github.run_id }} (${{ inputs.config || 'base' }}, study ${{ needs.study.result }}${{ needs.test.outputs.report_run && format(', parts of run {0}', needs.test.outputs.report_run) || '' }})"; echo; cat "$RUNNER_TEMP/results/card.md" 2>/dev/null || echo "no card"; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"
