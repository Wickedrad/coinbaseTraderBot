name: TA jobs comparison

# The whole bot replayed on the history days with each reworked TA job on and off (research/taJobs.ts; thread "Rework
# TA signals into real bot edge", Oct 31). Reads the daily random sweep's caches from main (the Kalshi history and its
# replay, and the server's model and settings it copied); the server is not touched. Prints aggregates only (this
# repository is public) and posts the report as a comment on the commit.

on:
  workflow_dispatch:
    inputs:
      days:
        description: 'Most recent replay days to compare'
        required: false
        default: '240'
      split:
        description: 'First day scored as held out (YYYY-MM-DD; empty = the middle day)'
        required: false
        default: ''
  push:
    branches: ['claude/ta-jobs']
    paths: ['.github/workflows/ta-jobs.yml', 'research/taJobs.ts', 'research/backtest.ts', 'bot/strategy/**', 'bot/model/takeModel.ts']

permissions:
  contents: write
  actions: read

concurrency:
  group: ta-jobs-${{ github.ref }}
  cancel-in-progress: true

env:
  TJ_DAYS: ${{ inputs.days || '240' }}
  # Steven (Nov 5): no DOGE in any replay, sweep or score until he says otherwise.
  HISTORY_REPLAY_ASSETS: 'BTC,ETH,SOL,XRP'
  # The replay leaves DOGE out by default (research/replay.ts, #265); set here so this workflow never trades it.
  REPLAY_EXCLUDE: 'DOGE'
  # Each variant replays its days in two halves on two runners (one would pass GitHub's 6-hour job limit); the report adds
  # them together. Steven (Nov 1): history iterations must be deep on days and cover several market regimes.
  TJ_PARTS: '2'
  TJ_SPLIT: ${{ inputs.split || '' }}
  SWEEP_BANKROLL_USD: '200'
  # A push whose message holds [report-from:<run id>] only redoes the report of that earlier run (its replays and artifacts).
  TJ_REPORT_FROM: ${{ contains(github.event.head_commit.message, '[report-from:') && github.event.head_commit.message || '' }}

jobs:
  data:
    if: ${{ !contains(github.event.head_commit.message, '[report-from:') }}
    runs-on: ubuntu-latest
    timeout-minutes: 175
    outputs:
      variants: ${{ steps.v.outputs.variants }}
      gates: ${{ steps.v.outputs.gates }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      # Steven's rule (Nov 2): storage on Google Drive, not Actions caches (they were evicted mid-run twice).
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: The Kalshi history and its replay (the sweep's copy on Drive)
        run: |
          bash deploy/drive_lab.sh get raw/history data/history || echo "no raw/history on Drive: downloading from scratch"
          bash deploy/drive_lab.sh get simulated/kalshi-replay data/history-replay || echo "no replay on Drive: building it"
      - name: Repair stored quotes, download what is new, rebuild the replay
        run: |
          node --import tsx research/kalshiReplayData.ts --history data/history --out data/history-replay --days "$((TJ_DAYS + 3))" --budget-min 140 2>&1 \
            | grep -vE '^\[kalshi-replay-data\] (binance|kalshi|replay): .*(skipp|already|listing|page)' | tail -30
      # Round 4 lost its last six replays when the cache above was evicted mid-run (Nov 2, 06:05 UTC): the replays read the
      # same public market data from this run's artifact instead (Kalshi and Binance history only, never a server copy).
      - name: Hand the market data to the replays
        uses: actions/upload-artifact@v4
        with:
          name: ta-jobs-data
          path: |
            data/history
            data/history-replay
          retention-days: 2
          compression-level: 1
      # Pin one copy of the server's model and settings for every replay of this run: the daily sweep on main saves a new
      # copy, and replays that start hours apart would otherwise compare different models (round 3, Oct 31). The newest
      # sweep copy in the cache if one is still there, else the last copy this workflow kept on Drive; then on Drive for
      # this run's replays (caches were evicted mid-run on Nov 2).
      - name: Restore the server's model and settings (the sweep's copy on main)
        uses: actions/cache/restore@v4
        with:
          path: |
            data/models
            data/sweep-env
          key: kalshi-server-none
          restore-keys: kalshi-server-
      - name: Pin that copy on Drive for every replay of this run
        run: |
          if [ ! -f data/models/model.json ]; then bash deploy/drive_lab.sh get lab-copies/ta-jobs/server-latest data || true; echo "server copy from Drive (lab-copies/ta-jobs/server-latest)"; fi
          [ -f data/models/model.json ] || { echo "::error::no server copy in the cache or on Drive: run kalshi-sweep's server job first"; exit 1; }
          echo "model.json $(date -u -r data/models/model.json +%FT%TZ)"
          bash deploy/drive_lab.sh put "lab-copies/ta-jobs/$GITHUB_RUN_ID/server" data --include '/models/**' --include '/sweep-env/**'
          bash deploy/drive_lab.sh put lab-copies/ta-jobs/server-latest data --include '/models/**' --include '/sweep-env/**'
      - name: The variants
        id: v
        run: |
          echo "variants=$(node --import tsx -e "import('./research/taJobs.ts').then((m) => console.log(JSON.stringify(Object.keys(m.VARIANTS))))")" >> "$GITHUB_OUTPUT"
          echo "gates=$(node --import tsx -e "import('./research/taJobs.ts').then((m) => console.log(JSON.stringify(Object.keys(m.GATE_VARIANTS))))")" >> "$GITHUB_OUTPUT"

  run:
    needs: [data]
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Coordinator (Nov 5): up to 10 jobs at once for the project (was 3), about 50 across the project.
      max-parallel: 10
      matrix:
        variant: ${{ fromJson(needs.data.outputs.variants) }}
        part: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: The market data (this run's artifact)
        uses: actions/download-artifact@v4
        with:
          name: ta-jobs-data
          path: data
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: The server's model and settings this run pinned (Drive)
        run: bash deploy/drive_lab.sh get "lab-copies/ta-jobs/$GITHUB_RUN_ID/server" data
      - name: Replay ${{ matrix.variant }}
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS" --part "${{ matrix.part }}/$TJ_PARTS"
          if [ -f data/sweep-env/train.env ]; then set -a; . data/sweep-env/train.env; set +a; echo "server settings: $(wc -l < data/sweep-env/train.env) line(s)"; else echo "no server settings cached: the bot's defaults"; fi
          cp -rn data/sweep-env/history/. data/history/ 2>/dev/null || true
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper RS_TRIALS_FILE="$GITHUB_WORKSPACE/data/sweep-env/component_trials.json"
          echo "model: $([ -f data/models/model.json ] && echo "the server's" || echo identity)"
          node --import tsx research/taJobs.ts run --part "p${{ matrix.part }}" --variant "${{ matrix.variant }}" --days data/sweep-days --model data/models/model.json --out research/out/ta-jobs \
            $([ "${{ matrix.variant }}" = baseline ] && echo --entry-log) 2>&1 | grep -E '^\[ta-jobs\]|Error|error' | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ta-jobs-${{ matrix.variant }}-p${{ matrix.part }}
          path: research/out/ta-jobs/
          retention-days: 30

  run-gate:
    needs: [data, run]
    if: ${{ !cancelled() && needs.data.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    strategy:
      fail-fast: false
      # Coordinator (Nov 5): up to 10 jobs at once for the project (was 3), about 50 across the project.
      max-parallel: 10
      matrix:
        variant: ${{ fromJson(needs.data.outputs.gates) }}
        part: [1, 2]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: The market data (this run's artifact)
        uses: actions/download-artifact@v4
        with:
          name: ta-jobs-data
          path: data
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: The server's model and settings this run pinned (Drive)
        run: bash deploy/drive_lab.sh get "lab-copies/ta-jobs/$GITHUB_RUN_ID/server" data
      - uses: actions/download-artifact@v4
        with:
          pattern: ta-jobs-baseline-p*
          path: research/out/ta-jobs
          merge-multiple: true
      - name: Replay ${{ matrix.variant }}
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS"
          if [ -f data/sweep-env/train.env ]; then set -a; . data/sweep-env/train.env; set +a; echo "server settings: $(wc -l < data/sweep-env/train.env) line(s)"; else echo "no server settings cached: the bot's defaults"; fi
          cp -rn data/sweep-env/history/. data/history/ 2>/dev/null || true
          export DATA_DIR="$GITHUB_WORKSPACE/data" TRADING_MODE=paper RS_TRIALS_FILE="$GITHUB_WORKSPACE/data/sweep-env/component_trials.json"
          echo "model: $([ -f data/models/model.json ] && echo "the server's" || echo identity)"
          node --import tsx research/taJobs.ts train-gate --days data/sweep-days --out research/out/ta-jobs $([ -n "$TJ_SPLIT" ] && echo --split "$TJ_SPLIT") 2>&1 | grep -E '^\[ta-jobs\]|Error' | head -10
          rm -f research/out/ta-jobs/baseline*.json research/out/ta-jobs/baseline*.entries.jsonl
          node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS" --part "${{ matrix.part }}/$TJ_PARTS"
          node --import tsx research/taJobs.ts run --part "p${{ matrix.part }}" --variant "${{ matrix.variant }}" --days data/sweep-days --model data/models/model.json --out research/out/ta-jobs \
            $([ "${{ matrix.variant }}" = baseline ] && echo --entry-log) 2>&1 | grep -E '^\[ta-jobs\]|Error|error' | head -20
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ta-jobs-gate-${{ matrix.variant }}-p${{ matrix.part }}
          path: research/out/ta-jobs/
          retention-days: 30

  report:
    needs: [data, run, run-gate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: Which run to report
        id: src
        run: |
          from=$(printf '%s' "$TJ_REPORT_FROM" | grep -oE '\[report-from:[0-9]+\]' | grep -oE '[0-9]+' || true)
          echo "run=${from:-${{ github.run_id }}}" >> "$GITHUB_OUTPUT"
      # The same paths as the save in the data job: a cache's version covers its paths, so a subset never matches.
      - uses: actions/cache/restore@v4
        with:
          path: |
            data/history
            data/history-replay
          key: ta-jobs-replay-${{ steps.src.outputs.run }}
          # The run's own copy can be evicted by the time a long run reports; any later copy holds the same days.
          restore-keys: |
            ta-jobs-replay-
            kalshi-replay-
      - uses: actions/download-artifact@v4
        with:
          pattern: ta-jobs-*
          path: research/out/ta-jobs
          merge-multiple: true
          run-id: ${{ steps.src.outputs.run }}
          github-token: ${{ github.token }}
      - name: Report
        run: |
          # Without the replay (its caches evicted) the report takes the days the results span (taJobs.ts dayList).
          [ -d data/history-replay ] && node --import tsx research/randomSweep.ts days --replay data/history-replay --out data/sweep-days --days "$TJ_DAYS"
          { node --import tsx research/taJobs.ts report --days data/sweep-days --out research/out/ta-jobs $([ -n "$TJ_SPLIT" ] && echo --split "$TJ_SPLIT") 2>&1
            echo "job 3, the mid-anchored take gate:"
            node --import tsx research/taJobs.ts train-gate --days data/sweep-days --out research/out/ta-jobs --gate-out "$RUNNER_TEMP/take_mid.json" $([ -n "$TJ_SPLIT" ] && echo --split "$TJ_SPLIT") 2>&1 | grep -E '^\[ta-jobs\]|Error'; } | tee "$RUNNER_TEMP/report.txt" | tail -80
      - name: Post the report on the commit
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          { echo "TA jobs comparison, run ${{ steps.src.outputs.run }}"; echo; echo '```'; tail -120 "$RUNNER_TEMP/report.txt" 2>/dev/null; echo '```'; } > "$RUNNER_TEMP/comment.md"
          gh api -X POST "repos/${{ github.repository }}/commits/${{ github.sha }}/comments" -F body=@"$RUNNER_TEMP/comment.md" --silent || echo "could not post the comment"
