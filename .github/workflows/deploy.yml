# Deploys to the Lightsail box (static IP, systemd service `kalshi-bot`).
#
#  - Every push to main (i.e. when a PR is merged) that changes bot code tests, builds and deploys automatically
#    (Steven, Nov 5: no batching). A push that changes only research files (docs, python, tests, unbundled research,
#    other workflows) skips the deploy and restart (Steven, Nov 11, 8:18 AM EST / 13:18 UTC). The scope job decides
#    from the files changed since the last deploy (deploy/deploy-scope.ts), never from the message: "[skip deploy]"
#    no longer skips a push that changes bot code (it deploys, with a warning). "[skip ci]" still stops GitHub from
#    starting this workflow at all, so a bot change pushed with it gets no deploy of its own: the next deploy ships it
#    and its summary names it as batched. Research-only merges need neither tag to skip it.
#  - Every deploy is logged, so a problem can be matched to the merge and restart that caused it: one JSON line per
#    deploy in ~/bot/deploys.log on the server (time, release, commit, the PRs it brought since the last deploy),
#    and the same list in the run's summary.
#  - Run manually from the Actions tab to redeploy main, or to deploy an existing release tag
#    (v1.2.3) by entering it.
#  - Rollback is one command on the server: `bash ~/bot/current/deploy/rollback.sh`.
#
# Switching to reviewed, tag-only deploys later (more secure): set the repository variable
# AUTO_DEPLOY=false (Settings > Secrets and variables > Actions > Variables) and add required
# reviewers to the `production` environment. See docs/DEPLOY.md.
#
# The server keeps its own ~/bot/bot.env (TRADING_MODE etc.); this workflow never changes trading
# mode or credentials. A fresh server gets a paper-mode bot.env on first deploy.
#
# Required secrets: LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Deploy

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      paper_only:
        description: 'Require paper mode before activation and verify the running process afterwards'
        type: boolean
        default: false
      tag:
        description: 'Optional: release tag to deploy instead of the current branch (e.g. v2.0.0)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  # Does this push change anything that reaches the server? Compares the files changed since the last deploy
  # (deploy/deploy-scope.ts lists what counts as research-only). Also finds the last deployed commit for the deploy log.
  scope:
    if: github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY != 'false'
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.scope.outputs.deploy }}
      prev: ${{ steps.prev.outputs.prev }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Last deployed commit
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Last earlier run of this workflow whose deploy job succeeded (its head commit). A run whose deploy was skipped
          # (research-only) or failed does not count. A tag deployed by a manual run or a rollback on the server is not
          # seen: research-only pushes leave it in place. A failed API call is not "no deploy found": lookup=failed makes
          # the push deploy, since the comparison could miss an earlier bot change whose own deploy failed.
          prev="" lookup=ok
          if runs=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=100" --jq '.workflow_runs[] | "\(.id):\(.head_sha)"'); then
            for run in $runs; do
              [ "${run%%:*}" = "$GITHUB_RUN_ID" ] && continue
              if ! ok=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/${run%%:*}/jobs" --jq '[.jobs[] | select(.name == "deploy" and .conclusion == "success")] | length'); then
                lookup=failed; break
              fi
              if [ "$ok" -gt 0 ]; then prev=${run#*:}; break; fi
            done
          else
            lookup=failed
          fi
          echo "previous deploy: ${prev:-unknown} (lookup $lookup)"
          { echo "prev=$prev"; echo "lookup=$lookup"; } >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # The lockfile's esbuild alone (no npm ci), for the bundle check: deploy-scope.ts repeats the build's esbuild runs
      # with --metafile to list the research/ files the release bundles. Without it every research/ source file counts
      # as bot code.
      - name: Bundler for the bundle check
        id: esbuild
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          v=$(node -p "require('./package-lock.json').packages['node_modules/esbuild'].version")
          mkdir -p "$RUNNER_TEMP/esbuild" && cd "$RUNNER_TEMP/esbuild" && echo '{"private":true}' > package.json
          npm install --no-audit --no-fund --loglevel=error "esbuild@$v"
          echo "bin=$RUNNER_TEMP/esbuild/node_modules/.bin/esbuild" >> "$GITHUB_OUTPUT"

      - name: Does this push change bot code
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          PREV_DEPLOY: ${{ steps.prev.outputs.prev }}
          PREV_LOOKUP: ${{ steps.prev.outputs.lookup }}
          BEFORE: ${{ github.event.before }}
          HEAD_MESSAGE: ${{ github.event.head_commit.message }}
          ESBUILD: ${{ steps.esbuild.outputs.bin }}
        run: |
          # Writes deploy=true|false and the run summary; whatever it cannot tell (lookup failed, no base) deploys.
          node --experimental-strip-types --disable-warning=ExperimentalWarning deploy/deploy-scope.ts || echo "deploy=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: scope
    permissions:
      contents: read
    # Manual runs always deploy. A push deploys unless AUTO_DEPLOY is 'false' or the scope job found nothing that reaches
    # the server changed since the last deploy; "[skip deploy]" in the message no longer decides. Only an explicit
    # 'false' from the scope job skips: a failed scope job deploys.
    if: ${{ !cancelled() && (github.event_name == 'workflow_dispatch' || (vars.AUTO_DEPLOY != 'false' && needs.scope.outputs.deploy != 'false')) }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        if: inputs.tag != ''
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}
          fetch-depth: 0

      - name: Merges this deploy brings
        id: merges
        env:
          # Last earlier run of this workflow whose deploy job succeeded (the scope job's "Last deployed commit").
          PREV: ${{ needs.scope.outputs.prev }}
        run: |
          prev="$PREV"
          prs=""
          if [ -n "$prev" ] && git cat-file -e "$prev^{commit}" 2>/dev/null; then
            prs=$(git log --first-parent --reverse --format=%s "$prev..HEAD" | grep -oE '#[0-9]+' | sort -u -t'#' -k2 -n | paste -sd, - || true)
          fi
          echo "previous deploy: ${prev:-unknown}; brings: ${prs:-none found}"
          { echo "prev=$prev"; echo "prs=$prs"; } >> "$GITHUB_OUTPUT"
          { echo "### Deploy $(git rev-parse --short HEAD)"; echo "Previous deploy: \`${prev:0:7}\`"; echo "Brings: ${prs:-none found}"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Release name
        id: rel
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=main-$(date -u +%Y%m%d%H%M)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (lockfile only), verify, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          echo "${{ steps.rel.outputs.name }}" > dist/RELEASE
          # Ship TA-Lib as source only (the server compiles it once and reuses the build), with a fingerprint
          # of the lockfile and the TA-Lib sources so the server can tell when nothing changed.
          git clean -fdxq vendor/talib
          { sha256sum package-lock.json; git ls-files -s vendor/talib; } | sha256sum | cut -d' ' -f1 > deploy/deps.fingerprint

      - name: Verify paper mode before deploying this release
        if: inputs.paper_only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          # No script_stop here: it inserts an exit-code line after every script line, inside the Python heredoc too,
          # which made this check a SyntaxError on every run. set -euo pipefail stops on the first failure instead.
          script: |
            set -euo pipefail
            python3 - <<'PYMODE'
            import pathlib
            p = pathlib.Path.home() / 'bot/bot.env'
            mode = 'paper'
            if p.exists():
                for line in p.read_text().splitlines():
                    key, sep, value = line.strip().partition('=')
                    if sep and key.strip() == 'TRADING_MODE':
                        mode = value.strip().strip('"\'')
            if mode != 'paper':
                raise SystemExit('Deployment blocked: TRADING_MODE must be paper for this release')
            print('Verified configured TRADING_MODE=paper; no environment values changed')
            PYMODE

      # A full disk stops the upload and the bot alike. Recordings (one file per day in ~/bot/data/recordings)
      # are almost all of the disk: below 5 GB free, the oldest days go (never the newest two) until 10 GB is
      # free; below 2 GB, yesterday goes too. The bot does the same at startup and every 10 minutes
      # (RECORDINGS_MIN_FREE_GB / RECORDINGS_PRUNE).
      - name: Make room on the server disk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            free_gb() { df -P -BG ~ | awk 'NR==2 {gsub("G","",$4); print $4}'; }
            echo "free before: $(free_gb) GB"
            if [ "$(free_gb)" -lt 5 ] && grep -qs '^RECORDINGS_PRUNE=false' ~/bot/bot.env; then
              echo "RECORDINGS_PRUNE=false in bot.env: not deleting recordings"; exit 0
            fi
            if [ "$(free_gb)" -lt 5 ]; then
              days=$(ls ~/bot/data/recordings 2>/dev/null | sed -nE 's/^md-([0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl(\.gz)?$/\1/p' | sort -u)
              keep=$(echo "$days" | tail -n 2)
              for d in $days; do
                [ "$(free_gb)" -ge 10 ] && break
                echo "$keep" | grep -qx "$d" && break
                echo "deleting recorded day $d"
                rm -f ~/bot/data/recordings/md-$d.jsonl ~/bot/data/recordings/md-$d.jsonl.gz ~/bot/data/recordings/md-$d.jsonl.gz.tmp
              done
            fi
            # Nearly full with only the newest two days left (a plain day can pass 20 GB): yesterday goes too, only
            # today stays. The bot cannot start on a full disk.
            if [ "$(free_gb)" -lt 2 ]; then
              days=$(ls ~/bot/data/recordings 2>/dev/null | sed -nE 's/^md-([0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl(\.gz)?$/\1/p' | sort -u)
              newest=$(echo "$days" | tail -n 1)
              for d in $days; do
                [ "$(free_gb)" -ge 10 ] && break
                [ "$d" = "$newest" ] && break
                echo "disk nearly full: deleting recorded day $d"
                rm -f ~/bot/data/recordings/md-$d.jsonl ~/bot/data/recordings/md-$d.jsonl.gz ~/bot/data/recordings/md-$d.jsonl.gz.tmp
              done
            fi
            echo "free after: $(free_gb) GB"

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "dist,web/dist,params,package.json,package-lock.json,deploy,vendor"
          target: "~/releases/${{ steps.rel.outputs.name }}"

      - name: Activate release (keeps previous for rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Optional: repository secret DASHBOARD_PASSWORD turns on the dashboard login (empty = no login).
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        with:
          envs: DASHBOARD_PASSWORD
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          # A fresh TA-Lib compile on a busy small instance can take several minutes.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/releases/${{ steps.rel.outputs.name }}
            # Build tools for TA-Lib (compiled from vendor/talib on install) and python venv + git for
            # tvdatafeed (deploy/tv_history.py); installed once, skipped when present.
            if ! command -v g++ >/dev/null || ! command -v make >/dev/null || ! python3 -c 'import ensurepip' 2>/dev/null || ! command -v git >/dev/null; then
              sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential python3 python3-venv git
            fi
            # Node 20+ (the bot targets 22); installed from NodeSource when missing or older.
            if ! command -v node >/dev/null || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs
            fi
            # The previous bot ran under pm2 (crypto-bot) on the same port: stop it for good.
            if command -v pm2 >/dev/null; then
              pm2 delete crypto-bot 2>/dev/null || true
              pm2 delete coinbaseTraderBot 2>/dev/null || true
              pm2 save --force 2>/dev/null || true
            fi
            # Dependencies: reuses the live release's modules and TA-Lib build when unchanged (deploy/install.sh).
            bash deploy/install.sh
            bash deploy/activate.sh ~/releases/${{ steps.rel.outputs.name }}
            # Deploy log: one line per deploy, so a restart and any issue after it can be matched to the merges it brought.
            printf '{"at":"%s","release":"%s","sha":"%s","prev_sha":"%s","prs":"%s","event":"%s","run":"%s"}\n' \
              "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "${{ steps.rel.outputs.name }}" "${{ github.sha }}" "${{ steps.merges.outputs.prev }}" \
              "${{ steps.merges.outputs.prs }}" "${{ github.event_name }}" "${{ github.run_id }}" >> ~/bot/deploys.log
            # Keep the 5 newest releases (plus whatever current/previous point to).
            keep="$(readlink ~/bot/current):$(readlink ~/bot/previous 2>/dev/null || true)"
            ls -dt ~/releases/*/ | tail -n +6 | while read -r d; do d="${d%/}"; case ":$keep:" in *":$d:"*) ;; *) rm -rf "$d";; esac; done

      - name: Verify running paper process
        if: inputs.paper_only
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          # No script_stop (see "Verify paper mode before deploying this release"): set -euo pipefail instead.
          script: |
            set -euo pipefail
            systemctl is-active --quiet kalshi-bot
            python3 - <<'PYMODE'
            import pathlib, subprocess
            pid = subprocess.check_output(['systemctl','show','--property=MainPID','--value','kalshi-bot'], text=True).strip()
            values = dict(x.split(b'=',1) for x in pathlib.Path('/proc',pid,'environ').read_bytes().split(b'\0') if b'=' in x)
            if values.get(b'TRADING_MODE', b'paper') != b'paper':
                raise SystemExit('Running process is not in paper mode')
            print('Verified active kalshi-bot process in paper mode')
            PYMODE
