# Deploys to the Lightsail box (static IP, systemd service `kalshi-bot`).
#
#  - Merges are batched (Steven, Nov 4): main deploys at three set times a day, each landing its restart inside a session-edge
#    window where the bot already takes no new entries (bot/model/sessions.ts, 40 min), and clear of the 07:15-08:15 UTC
#    nightly Drive copy. Start times (deploys take ~10-15 min):
#      00:05 UTC / 7:05 PM EST -> Tokyo open (00:00-00:40),
#      14:35 UTC / 9:35 AM EST -> New York open (14:30-15:10), after the 9:15 AM EST daily health check,
#      20:25 UTC / 3:25 PM EST -> New York close (20:20-21:00).
#    A scheduled run deploys only when main moved since the last successful deploy. GitHub cron is UTC only: when US/UK
#    daylight saving starts (March) these land an hour off the New York and London edges and need moving.
#  - Run manually from the Actions tab to redeploy main, or to deploy an existing release tag
#    (v1.2.3) by entering it.
#  - Rollback is one command on the server: `bash ~/bot/current/deploy/rollback.sh`.
#
# Switching to reviewed, tag-only deploys later (more secure): set the repository variable
# AUTO_DEPLOY=false (Settings > Secrets and variables > Actions > Variables) and add required
# reviewers to the `production` environment. See docs/DEPLOY.md.
#
# The server keeps its own ~/bot/bot.env (TRADING_MODE etc.); this workflow never changes trading
# mode or credentials. A fresh server gets a paper-mode bot.env on first deploy.
#
# Required secrets: LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT).
name: Deploy

on:
  schedule:
    - cron: '5 0 * * *'
    - cron: '35 14 * * *'
    - cron: '25 20 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Optional: release tag to deploy instead of the current branch (e.g. v2.0.0)'
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  changed:
    # A scheduled batch deploys only when main has moved since the last successful deploy; manual runs always deploy.
    runs-on: ubuntu-latest
    permissions:
      actions: read
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != schedule ]; then echo go=true >> "$GITHUB_OUTPUT"; exit 0; fi
          last=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/deploy.yml/runs?status=success&per_page=1" --jq '.workflow_runs[0].head_sha // ""')
          if [ "$last" = "$GITHUB_SHA" ]; then echo "main $GITHUB_SHA is already deployed"; echo go=false >> "$GITHUB_OUTPUT"
          else echo "main moved: $last -> $GITHUB_SHA"; echo go=true >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: changed
    # Scheduled batches deploy unless AUTO_DEPLOY is set to 'false'; manual runs always deploy.
    if: needs.changed.outputs.go == 'true' && (github.event_name == 'workflow_dispatch' || vars.AUTO_DEPLOY != 'false')
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Validate tag format
        if: inputs.tag != ''
        run: |
          [[ "${{ inputs.tag }}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "tag must look like v1.2.3"; exit 1; }

      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag != '' && format('refs/tags/{0}', inputs.tag) || github.sha }}

      - name: Release name
        id: rel
        run: |
          if [ -n "${{ inputs.tag }}" ]; then echo "name=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else echo "name=main-$(date -u +%Y%m%d%H%M)-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (lockfile only), verify, build
        run: |
          npm ci
          npm run typecheck
          npm test
          npm run build
          echo "${{ steps.rel.outputs.name }}" > dist/RELEASE
          # Ship TA-Lib as source only (the server compiles it once and reuses the build), with a fingerprint
          # of the lockfile and the TA-Lib sources so the server can tell when nothing changed.
          git clean -fdxq vendor/talib
          { sha256sum package-lock.json; git ls-files -s vendor/talib; } | sha256sum | cut -d' ' -f1 > deploy/deps.fingerprint

      # A full disk stops the upload and the bot alike. Recordings (one file per day in ~/bot/data/recordings)
      # are almost all of the disk: below 5 GB free, the oldest days go (never the newest two) until 10 GB is
      # free; below 2 GB, yesterday goes too. The bot does the same at startup and every 10 minutes
      # (RECORDINGS_MIN_FREE_GB / RECORDINGS_PRUNE).
      - name: Make room on the server disk
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script: |
            free_gb() { df -P -BG ~ | awk 'NR==2 {gsub("G","",$4); print $4}'; }
            echo "free before: $(free_gb) GB"
            if [ "$(free_gb)" -lt 5 ] && grep -qs '^RECORDINGS_PRUNE=false' ~/bot/bot.env; then
              echo "RECORDINGS_PRUNE=false in bot.env: not deleting recordings"; exit 0
            fi
            if [ "$(free_gb)" -lt 5 ]; then
              days=$(ls ~/bot/data/recordings 2>/dev/null | sed -nE 's/^md-([0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl(\.gz)?$/\1/p' | sort -u)
              keep=$(echo "$days" | tail -n 2)
              for d in $days; do
                [ "$(free_gb)" -ge 10 ] && break
                echo "$keep" | grep -qx "$d" && break
                echo "deleting recorded day $d"
                rm -f ~/bot/data/recordings/md-$d.jsonl ~/bot/data/recordings/md-$d.jsonl.gz ~/bot/data/recordings/md-$d.jsonl.gz.tmp
              done
            fi
            # Nearly full with only the newest two days left (a plain day can pass 20 GB): yesterday goes too, only
            # today stays. The bot cannot start on a full disk.
            if [ "$(free_gb)" -lt 2 ]; then
              days=$(ls ~/bot/data/recordings 2>/dev/null | sed -nE 's/^md-([0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl(\.gz)?$/\1/p' | sort -u)
              newest=$(echo "$days" | tail -n 1)
              for d in $days; do
                [ "$(free_gb)" -ge 10 ] && break
                [ "$d" = "$newest" ] && break
                echo "disk nearly full: deleting recorded day $d"
                rm -f ~/bot/data/recordings/md-$d.jsonl ~/bot/data/recordings/md-$d.jsonl.gz ~/bot/data/recordings/md-$d.jsonl.gz.tmp
              done
            fi
            echo "free after: $(free_gb) GB"

      - name: Upload release to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          source: "dist,web/dist,params,package.json,package-lock.json,deploy,vendor"
          target: "~/releases/${{ steps.rel.outputs.name }}"

      - name: Activate release (keeps previous for rollback)
        uses: appleboy/ssh-action@v1.0.3
        env:
          # Optional: repository secret DASHBOARD_PASSWORD turns on the dashboard login (empty = no login).
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
        with:
          envs: DASHBOARD_PASSWORD
          host: ${{ secrets.LIGHTSAIL_HOST }}
          username: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          key: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          port: ${{ secrets.LIGHTSAIL_PORT || 22 }}
          script_stop: true
          # A fresh TA-Lib compile on a busy small instance can take several minutes.
          command_timeout: 30m
          script: |
            set -euo pipefail
            cd ~/releases/${{ steps.rel.outputs.name }}
            # Build tools for TA-Lib (compiled from vendor/talib on install) and python venv + git for
            # tvdatafeed (deploy/tv_history.py); installed once, skipped when present.
            if ! command -v g++ >/dev/null || ! command -v make >/dev/null || ! python3 -c 'import ensurepip' 2>/dev/null || ! command -v git >/dev/null; then
              sudo apt-get update -qq && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq build-essential python3 python3-venv git
            fi
            # Node 20+ (the bot targets 22); installed from NodeSource when missing or older.
            if ! command -v node >/dev/null || [ "$(node -p 'process.versions.node.split(".")[0]')" -lt 20 ]; then
              curl -fsSL https://deb.nodesource.com/setup_22.x | sudo -E bash - && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq nodejs
            fi
            # The previous bot ran under pm2 (crypto-bot) on the same port: stop it for good.
            if command -v pm2 >/dev/null; then
              pm2 delete crypto-bot 2>/dev/null || true
              pm2 delete coinbaseTraderBot 2>/dev/null || true
              pm2 save --force 2>/dev/null || true
            fi
            # Dependencies: reuses the live release's modules and TA-Lib build when unchanged (deploy/install.sh).
            bash deploy/install.sh
            bash deploy/activate.sh ~/releases/${{ steps.rel.outputs.name }}
            # Keep the 5 newest releases (plus whatever current/previous point to).
            keep="$(readlink ~/bot/current):$(readlink ~/bot/previous 2>/dev/null || true)"
            ls -dt ~/releases/*/ | tail -n +6 | while read -r d; do d="${d%/}"; case ":$keep:" in *":$d:"*) ;; *) rm -rf "$d";; esac; done
