name: Outside data (OR-XD)

# OR-XD: outside derivatives data for the heat curves (design: /mnt/project-files/outside-data/OR-XD-design.md;
# python/oracle/prereg/OR-XD.md). Pushes drive it (a new workflow cannot be dispatched until it is on main).
# Tags in the HEAD commit message:
#   none            the heat tests only (test_heat_outside.py and test_heat.py)
#   [xd-inventory]  read-only look at what Drive already holds under raw/ (names, sizes, upload dates, header and
#                   first/last stamps of each CSV). Downloads NOTHING from Binance. Prints no market rows.
#   [xd-probe]      Step P of the design, runner only: reachability by status code (python/oracle/xd_probe.sh): Binance spot
#                   and futures APIs, the data-api.binance.vision API host (NOT the data.binance.vision archive), Coinalyze
#                   without a key, Bybit, OKX, Coinbase, and WebSocket handshakes. No secrets, no server, no data kept.
#   [xd-probe-server] the same script run read-only on the Lightsail server over SSH (sent on stdin, nothing written there,
#                   nice 19, status codes only). Needs Steven's word: it is a production read.
#   [xd-assets:BTC] with [xd-lite]: narrow the coins (BTC, ETH, SOL, XRP; never DOGE). One coin answers whether the
#                   modelled liquidation clusters exist at all before the full study; the league then says 'partial'.
#   [xd-lag:1]      with [xd-lite]: every perp input seen 1 minute late (--perp-lag; 0 is the default; 1 and 5 are the
#                   lag-robustness reruns of the prereg).
#   [xd-lite]       the lite study: per coin (BTC, ETH, SOL, XRP) two jobs (the coin + twin 1; twins 2 + 3) on the
#                   spot, USD-M perpetual and open-interest files that are ALREADY on Drive (raw/perp-ta-history/<A>/),
#                   each cut at HEAT_END (2026-01-01) before the engine sees it, then the league (heat.league, unchanged).
#                   Nothing is downloaded from any exchange (the Binance Vision terms v1.0 are an open gate for new
#                   downloads and for live use). Outputs (aggregates only): Drive models/oracle-xd/runs/<run>/<coin>[-twinN]/
#                   and league/; the league's small files also as a run artifact and committed to this branch under
#                   research/oracle_xd/latest/. No per-minute row leaves the runner.
# NEVER DOGE.

on:
  push:
    branches: [claude/project-thread-8dnpsq]
    paths: ['.github/workflows/outside-xd.yml', 'python/oracle/heat_outside.py', 'python/oracle/tests/test_heat_outside*.py',
            'python/oracle/prereg/OR-XD*.md', 'python/oracle/heat.py']

permissions:
  contents: read

concurrency:
  group: ${{ contains(github.event.head_commit.message, '[xd-lite]') && format('outside-xd-study-{0}', github.run_id) || format('outside-xd-{0}', github.ref) }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  R: gdrive:kalshi-bot-archive
  PYTHONUNBUFFERED: '1'

jobs:
  probe:
    if: ${{ contains(github.event.head_commit.message, '[xd-probe]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: From this runner (public endpoints only; no secrets, no server)
        run: bash python/oracle/xd_probe.sh

  probe-server:
    if: ${{ contains(github.event.head_commit.message, '[xd-probe-server]') }}
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: From the Lightsail server (read-only; script on stdin, nothing written there)
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          set -euo pipefail
          test -n "$SSH_KEY" && test -n "$HOST"
          [[ "$PORT" =~ ^[0-9]+$ ]]
          mkdir -p "$RUNNER_TEMP/xd-ssh"; chmod 700 "$RUNNER_TEMP/xd-ssh"
          key="$RUNNER_TEMP/xd-ssh/key"
          printf '%s\n' "$SSH_KEY" > "$key"; chmod 600 "$key"
          trap 'rm -f "$key"' EXIT
          ssh -i "$key" -p "$PORT" -o BatchMode=yes -o ConnectTimeout=20 \
            -o StrictHostKeyChecking=accept-new -o UserKnownHostsFile="$RUNNER_TEMP/xd-ssh/known_hosts" \
            -o ServerAliveInterval=15 -o ServerAliveCountMax=3 \
            "$USER_NAME@$HOST" 'nice -n 19 bash -s' < python/oracle/xd_probe.sh

  inventory:
    if: ${{ contains(github.event.head_commit.message, '[xd-inventory]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: raw/ top level
        run: |
          set -uo pipefail
          for d in raw derived models simulated; do
            echo "::group::$d/"; rclone lsd "$R/$d" 2>&1 | awk '{print $NF}' | head -80; echo "::endgroup::"
          done
      - name: raw/perp-ta-history per coin (names, sizes, upload dates)
        run: |
          set -uo pipefail
          for A in BTC ETH SOL XRP; do
            echo "::group::raw/perp-ta-history/$A"
            rclone lsl "$R/raw/perp-ta-history/$A" 2>&1 | awk '{ n=$4; for(i=5;i<=NF;i++) n=n" "$i; printf "%12d %s %s %s\n", $1, $2, substr($3,1,8), n }' | grep -v -E '/manifest|\.json$' | head -150
            echo "::endgroup::"
          done
      - name: first/last rows of each CSV (stamps only; no price rows printed beyond the first and last)
        run: |
          set -uo pipefail
          for A in BTC ETH SOL XRP; do
            echo "::group::$A stamps"
            rclone lsf "$R/raw/perp-ta-history/$A" -R --files-only --include '*.csv' 2>/dev/null | sort | while read -r f; do
              p="$R/raw/perp-ta-history/$A/$f"
              hdr=$(rclone cat "$p" --head 400 2>/dev/null | head -1)
              first=$(rclone cat "$p" --head 400 2>/dev/null | sed -n 2p | cut -d, -f1)
              last=$(rclone cat "$p" --tail 400 2>/dev/null | tail -1 | cut -d, -f1)
              size=$(rclone size "$p" 2>/dev/null | awk '/Total size/ {print $3 $4}')
              echo "$f | header: $hdr | first: $first | last: $last | $size"
            done
            echo "::endgroup::"
          done

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      study: ${{ steps.plan.outputs.study }}
      assets: ${{ steps.plan.outputs.assets }}
      lag: ${{ steps.plan.outputs.lag }}
      cluster: ${{ steps.plan.outputs.cluster }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt pytest
      - name: OR-XD tests and the heat engine's tests
        working-directory: python
        run: |
          set -o pipefail
          python3 -m pytest -q oracle/tests/test_heat_outside.py oracle/tests/test_heat_outside_lookahead.py oracle/tests/test_heat.py --durations=5 2>&1 | tail -40
      - name: Plan
        id: plan
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          if grep -qF '[xd-lite]' <<< "$MSG"; then echo "study=true" >> "$GITHUB_OUTPUT"; else echo "study=false" >> "$GITHUB_OUTPUT"; fi
          echo "study: $(grep -qF '[xd-lite]' <<< "$MSG" && echo yes || echo no)"
          a=$(grep -oE '\[xd-assets:[A-Z,]+\]' <<< "$MSG" | head -1 | sed -E 's/.*:([A-Z,]+)\]/\1/' || true)
          [ -n "$a" ] || a=BTC,ETH,SOL,XRP
          j=$(tr ',' '\n' <<< "$a" | { grep -E '^(BTC|ETH|SOL|XRP)$' || true; } | jq -Rnc '[inputs]')
          [ "$j" != '[]' ] || { echo "::error::no allowed coin in $a (BTC, ETH, SOL, XRP; never DOGE)"; exit 1; }
          echo "assets=$j" >> "$GITHUB_OUTPUT"; echo "coins: $j"
          lag=$(grep -oE '\[xd-lag:[0-9]+\]' <<< "$MSG" | head -1 | grep -oE '[0-9]+' || true)
          [ -n "$lag" ] || lag=0
          echo "lag=$lag" >> "$GITHUB_OUTPUT"; echo "perp lag: $lag min"
          cs=$(grep -oE '\[xd-cluster:0\.[0-9]+\]' <<< "$MSG" | head -1 | grep -oE '0\.[0-9]+' || true)
          [ -n "$cs" ] || cs=0.02
          echo "cluster=$cs" >> "$GITHUB_OUTPUT"; echo "LIQMAP cluster share of OI: $cs"

  check:
    # fail once and early (before 8 matrix jobs download) when a file or a header is not what the loaders read
    needs: test
    if: needs.test.outputs.study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: The three files of each coin exist with the expected headers
        env:
          ASSETS: ${{ needs.test.outputs.assets }}
        run: |
          set -uo pipefail
          bad=0
          for A in $(jq -r '.[]' <<< "$ASSETS"); do
            [ "$A" != DOGE ] || { echo "NEVER DOGE"; exit 1; }
            for spec in "binance-1m|1m.csv|ts,o,h,l,c,v,tb" "binance-um|1m.csv|ts,o,h,l,c,v,tb" "binance-oi|oi.csv|ts,oi,oi_usd"; do
              IFS='|' read -r dir file want <<< "$spec"
              d="$R/raw/perp-ta-history/$A/$dir/$A"
              if ! rclone lsf "$d" --files-only 2>/dev/null | grep -qx "$file"; then echo "::error::no $dir/$A/$file on Drive"; bad=1; continue; fi
              got=$(rclone cat "$d/$file" --head 400 2>/dev/null | head -1 | tr -d '\r')
              if [ "$got" != "$want" ]; then echo "::error::$dir/$A/$file header is '$got', expected '$want'"; bad=1; else echo "ok $dir/$A/$file"; fi
            done
          done
          exit $bad

  coin:
    needs: [test, check]
    if: needs.test.outputs.study == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        asset: ${{ fromJSON(needs.test.outputs.assets) }}          # BTC, ETH, SOL, XRP (never DOGE)
        twins: ['0 1', '2 3']                # 0 = the coin itself; n = its n-th no-signal twin
    env:
      A: ${{ matrix.asset }}
      TWINS: ${{ matrix.twins }}
      LAG: ${{ needs.test.outputs.lag }}
      XD_CLUSTER_SHARE: ${{ needs.test.outputs.cluster }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Spot, perpetual and open-interest files from Drive (raw/perp-ta-history/<A>, read only), cut at HEAT_END
        run: |
          set -euo pipefail
          [ "$A" != DOGE ] || { echo "NEVER DOGE"; exit 1; }
          bash deploy/drive_lab.sh get "raw/perp-ta-history/$A" data/hist --include "/binance-1m/$A/1m.csv" --include "/binance-um/$A/1m.csv" --include "/binance-oi/$A/oi.csv"
          end=$(cd python && python3 -c "from oracle.heat import HEAT_END; print(HEAT_END)")
          [ "$end" = 1767225600000 ] || { echo "::error::HEAT_END is $end, not 2026-01-01"; exit 1; }
          for rel in "binance-1m/$A/1m.csv" "binance-um/$A/1m.csv" "binance-oi/$A/oi.csv"; do
            f="data/hist/$rel"
            [ -s "$f" ] || { echo "::error::no $rel on Drive"; exit 1; }
            # the cut: rows at or after HEAT_END (2026-01-01 UTC) are dropped here, before anything computes on them
            awk -F, -v e="$end" 'NR == 1 || ($1 + 0) < e' "$f" > "$f.cut"
            mv "$f.cut" "$f"
            last=$(awk -F, 'NR > 1 && NF > 1 { x = $1 + 0 } END { printf "%.0f", x }' "$f")
            [ "$last" -lt "$end" ] || { echo "::error::$rel: a row at or after the cut is still in the file"; exit 1; }
            echo "$rel: $(du -h "$f" | cut -f1), header $(head -1 "$f"), first $(sed -n 2p "$f" | cut -d, -f1), last $last (cut at $end)"
          done
      - name: Readings, curves, events, pairs, triples
        working-directory: python
        run: |
          set -euo pipefail
          for tw in $TWINS; do
            d="$A"; [ "$tw" = 0 ] || d="$A-twin$tw"
            echo "::group::$d"
            /usr/bin/time -v -o "$RUNNER_TEMP/time.txt" python3 -m oracle.heat_outside coin --asset "$A" --twin "$tw" --perp-lag "$LAG" \
              --spot "../data/hist/binance-1m/$A/1m.csv" --perp "../data/hist/binance-um/$A/1m.csv" --oi "../data/hist/binance-oi/$A/oi.csv" \
              --out "../out/$d" | tail -120
            grep -E 'Maximum resident|Elapsed' "$RUNNER_TEMP/time.txt"
            ls -la "../out/$d"
            echo "::endgroup::"
            (cd .. && bash deploy/drive_lab.sh put "models/oracle-xd/runs/$GITHUB_RUN_ID/$d" "out/$d")
          done

  league:
    needs: [test, coin]
    if: ${{ !cancelled() && needs.test.result == 'success' && needs.test.outputs.study == 'true' && needs.coin.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/oracle/requirements.txt
      - run: pip install -q -r python/oracle/requirements.txt
      - name: Drive setup
        uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: League
        run: |
          set -euo pipefail
          bash deploy/drive_lab.sh get "models/oracle-xd/runs/$GITHUB_RUN_ID" data/coins --include "/*/heat.csv.gz" --include "/*/meta.json"
          ls data/coins
          (cd python && python3 -m oracle.heat league --inputs ../data/coins --out ../out/league) | tail -120
          ls -la out/league
          bash deploy/drive_lab.sh put "models/oracle-xd/runs/$GITHUB_RUN_ID/league" out/league
      - name: Collect the study's own meta numbers (aggregates only)
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, glob, os
          keys = ('near_duplicates', 'direction_coupling', 'reading_share', 'model', 'constants', 'xd_input', 'skipped_readings',
                  'skipped_inherited_from_real_coin', 'study', 'readings', 'event_levels', 'tested')
          out = {}
          for f in sorted(glob.glob('data/coins/*/meta.json')):
              name = os.path.basename(os.path.dirname(f))
              try:
                  m = json.load(open(f))
              except Exception as e:
                  out[name] = {'error': str(e)}
                  continue
              out[name] = {k: m[k] for k in keys if k in m}
          os.makedirs('out/league', exist_ok=True)
          json.dump(out, open('out/league/xd_meta.json', 'w'), indent=1, sort_keys=True)
          print('xd_meta.json', len(out), 'series', os.path.getsize('out/league/xd_meta.json'), 'bytes')
          PY
      - name: Commit the small league files to this branch (aggregates only; a bot push starts no workflow)
        env:
          BR: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          dst=research/oracle_xd/latest
          rm -rf "$dst"; mkdir -p "$dst"
          cp out/league/league.md out/league/summary.json "$dst/"; cp out/league/xd_meta.json "$dst/" 2>/dev/null || true
          echo "$GITHUB_RUN_ID $GITHUB_SHA" > "$dst/RUN"
          du -sh "$dst"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$dst"
          git commit -q -m "OR-XD lite: league aggregates of run $GITHUB_RUN_ID (written by the outside-xd workflow)"
          for i in 1 2 3 4; do
            if git pull -q --rebase origin "$BR" && git push -q origin "HEAD:$BR"; then echo pushed; exit 0; fi
            sleep $((2 ** i))
          done
          echo "::warning::could not push the league files"
      - uses: actions/upload-artifact@v4
        with:
          name: oracle-xd-league
          path: |
            out/league/league.md
            out/league/summary.json
            out/league/league_*.csv.gz
            out/league/viewer.json.gz
          if-no-files-found: warn
          retention-days: 30
