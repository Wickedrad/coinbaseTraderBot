name: Drive archive

# Copies each finished day's server recordings (md-YYYY-MM-DD.jsonl.gz), audit log (audit-YYYY-MM-DD*) and a snapshot
# of the paper bot's small state files to Steven's Google Drive, once. Labs then pull days from Drive
# (deploy/drive_pull.sh) instead of re-reading the server, and Drive keeps the days after Actions caches evict them.
#
# Light on the server: one run a day in the quiet hours, file-only reads at most 8 MB/s under nice 19 (never rsync -z),
# no work on the server beyond listing files. Days already on Drive are skipped, so a day leaves the server once.
#
# The repo is public: nothing is uploaded as an artifact and the log prints only file names, counts and sizes.
#
# Required secrets: LIGHTSAIL_HOST, LIGHTSAIL_USERNAME, LIGHTSAIL_SSH_KEY (optional LIGHTSAIL_PORT), as Deploy, and
# RCLONE_CONF: an rclone config holding a Google Drive remote named "gdrive" (scope drive.file, so the token can only
# see the files rclone itself made). Without RCLONE_CONF the run stops before it touches the server.

on:
  schedule:
    # 07:20 UTC = 2:20 AM EST (3:20 AM EDT): the day before has closed and trading is quiet.
    - cron: '20 7 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: 'Days to archive, comma separated (empty = every finished day on the server not yet on Drive)'
        required: false
        default: ''
      max_days:
        description: 'At most this many days per run (each is ~1-2 GB: ~3 min to copy at 8 MB/s plus ~15 min to make its compact copy)'
        required: false
        default: '6'
      overwrite:
        description: 'Copy a day again even if Drive already has it (true/false)'
        required: false
        default: 'false'
      history:
        description: 'Also mirror the server''s raw market history (bot/data/history -> raw/server-history) and model work (models/archive, models/work -> models/server) to Drive, only files Drive lacks (true/false; the schedule does it on Sundays)'
        required: false
        default: 'false'

permissions:
  contents: read

concurrency:
  group: drive-archive
  cancel-in-progress: false

env:
  DRIVE_ROOT: gdrive:kalshi-bot-archive

jobs:
  archive:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 300
    steps:
      # The compact copy of each day (md-DAY.mdc, scripts/mdc.ts, ~2.5x smaller than the gzip) is made on this runner.
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: Set up rclone with the Drive token
        env:
          RCLONE_CONF: ${{ secrets.RCLONE_CONF }}
        run: |
          set -euo pipefail
          if [ -z "$RCLONE_CONF" ]; then echo "::error::RCLONE_CONF secret is not set (see the header of this workflow)"; exit 1; fi
          sudo apt-get install -y -qq rclone >/dev/null
          mkdir -p ~/.config/rclone
          printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf && chmod 600 ~/.config/rclone/rclone.conf
          rclone mkdir "$DRIVE_ROOT/recordings" && rclone mkdir "$DRIVE_ROOT/audit" && rclone mkdir "$DRIVE_ROOT/paper"
          rclone lsf "$DRIVE_ROOT/recordings" --files-only > "$RUNNER_TEMP/drive-recordings.txt"
          echo "Drive has $(wc -l < "$RUNNER_TEMP/drive-recordings.txt") recorded day(s)"
      - name: SSH to the server
        env:
          SSH_KEY: ${{ secrets.LIGHTSAIL_SSH_KEY }}
          HOST: ${{ secrets.LIGHTSAIL_HOST }}
          USER_NAME: ${{ secrets.LIGHTSAIL_USERNAME || 'ubuntu' }}
          PORT: ${{ secrets.LIGHTSAIL_PORT || 22 }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_bot && chmod 600 ~/.ssh/id_bot
          printf 'Host bot\n  HostName %s\n  User %s\n  Port %s\n  IdentityFile ~/.ssh/id_bot\n  StrictHostKeyChecking accept-new\n  ServerAliveInterval 30\n' "$HOST" "$USER_NAME" "$PORT" > ~/.ssh/config
          ssh bot true && echo "connected"
      - name: Copy the missing finished days to Drive (read-only on the server)
        env:
          DAYS_IN: ${{ inputs.days || '' }}
          MAX_DAYS: ${{ inputs.max_days || '6' }}
          OVERWRITE: ${{ inputs.overwrite || 'false' }}
        run: |
          set -euo pipefail
          [[ "$MAX_DAYS" =~ ^[0-9]+$ ]] || { echo "max_days must be a number"; exit 1; }
          pull() { rsync -a --whole-file --bwlimit=8000 --rsync-path="nice -n 19 rsync" "$@"; }
          vanished_ok() { local c=$?; [ $c -eq 24 ] && return 0; return $c; }
          TODAY=$(date -u +%F)
          # In the first hour after midnight UTC yesterday's files may still be closing: treat yesterday as unfinished.
          [ "$(date -u +%H)" -ge 1 ] || TODAY=$(date -u -d yesterday +%F)
          if [ -n "$DAYS_IN" ]; then
            D=$(echo "$DAYS_IN" | tr -d ' ')
            [[ "$D" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}(,[0-9]{4}-[0-9]{2}-[0-9]{2})*$ ]] || { echo "days must be YYYY-MM-DD[,YYYY-MM-DD...]"; exit 1; }
            echo "$D" | tr ',' '\n' > "$RUNNER_TEMP/want.txt"
          else
            # Every recorded day on the server (plain or gzipped), oldest first.
            ssh -n bot "cd ~/bot/data/recordings && ls -1" | sed -nE 's/^md-([0-9]{4}-[0-9]{2}-[0-9]{2})\.jsonl(\.gz)?$/\1/p' | sort -u > "$RUNNER_TEMP/want.txt"
          fi
          # Finished days only (today's file is still being written), and not on Drive yet unless overwrite.
          : > "$RUNNER_TEMP/todo.txt"
          while read -r d; do
            [ -n "$d" ] && [[ "$d" < "$TODAY" ]] || continue
            if [ "$OVERWRITE" != true ] && grep -qx "md-$d.jsonl.gz" "$RUNNER_TEMP/drive-recordings.txt"; then continue; fi
            echo "$d" >> "$RUNNER_TEMP/todo.txt"
          done < "$RUNNER_TEMP/want.txt"
          head -n "$MAX_DAYS" "$RUNNER_TEMP/todo.txt" > "$RUNNER_TEMP/run.txt"
          echo "days to archive: $(wc -l < "$RUNNER_TEMP/todo.txt"); this run: $(paste -sd, "$RUNNER_TEMP/run.txt")"
          W="$RUNNER_TEMP/day"
          # A for loop, not while-read: ssh and rsync inside would read the day list from stdin and end the loop early.
          for d in $(cat "$RUNNER_TEMP/run.txt"); do
            rm -rf "$W" && mkdir -p "$W/rec" "$W/audit"
            f="md-$d.jsonl"
            if ssh bot "test -f ~/bot/data/recordings/$f.gz"; then
              pull "bot:bot/data/recordings/$f.gz" "$W/rec/" || vanished_ok
            elif ssh bot "test -f ~/bot/data/recordings/$f"; then
              # Not compressed on the server yet: gzipped here, on the runner.
              pull "bot:bot/data/recordings/$f" "$W/rec/" || vanished_ok; [ ! -f "$W/rec/$f" ] || gzip -6 "$W/rec/$f"
            fi
            ssh bot "cd ~/bot/data/audit && find . -maxdepth 1 -type f -name 'audit-$d*' -printf '%P\n'" > "$W/audit.txt" || true
            [ -s "$W/audit.txt" ] && { pull --files-from="$W/audit.txt" bot:bot/data/audit/ "$W/audit/" || vanished_ok; }
            # Check each gzip is whole before it goes up (a cut copy would be archived for good).
            for g in "$W"/rec/*.gz "$W"/audit/*.gz; do [ -f "$g" ] || continue; gzip -t "$g" || { echo "::error::$d: $(basename "$g") is not a whole gzip"; exit 1; }; done
            rclone copy "$W/audit" "$DRIVE_ROOT/audit" --transfers 2
            # The compact copy beside the gzip (encode checks the round trip; verify compares every line again).
            if [ -f "$W/rec/$f.gz" ]; then
              mkdir -p "$W/mdc"
              if node --import tsx scripts/mdc.ts encode "$W/rec/$f.gz" "$W/mdc/md-$d.mdc" >/dev/null && node --import tsx scripts/mdc.ts verify "$W/mdc/md-$d.mdc" "$W/rec/$f.gz" >/dev/null; then
                rclone copy "$W/mdc" "$DRIVE_ROOT/recordings" --transfers 1; echo "$d: compact copy $(du -sh "$W/mdc/md-$d.mdc" | cut -f1)"
              else echo "::warning::$d: compact copy failed its check, only the gzip is archived"; fi
            fi
            # The recording last: its presence on Drive is what marks the day archived.
            rclone copy "$W/rec" "$DRIVE_ROOT/recordings" --transfers 1
            echo "$d: recording $(du -sh "$W/rec" | cut -f1), audit $(wc -l < "$W/audit.txt") file(s) $(du -sh "$W/audit" | cut -f1)"
          done
      - name: Snapshot the paper bot's small state files
        if: ${{ github.event_name == 'schedule' || !inputs.days }}
        run: |
          set -euo pipefail
          S="$RUNNER_TEMP/paper/$(date -u +%F)"; mkdir -p "$S"
          for f in paper_exchange.json equity_guard.json quota_pacer_state.json take-profit-bench.json accuracy_gate.json probation.json component_trials.json; do
            rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" "bot:bot/data/$f" "$S/" 2>/dev/null || true
          done
          rclone copy "$RUNNER_TEMP/paper" "$DRIVE_ROOT/paper"
          echo "paper state: $(ls "$S" | wc -l) file(s)"
      - name: Mirror the raw history and the model work (Sundays, or history=true)
        if: ${{ github.event_name == 'schedule' || inputs.history == 'true' }}
        env:
          HIST: ${{ inputs.history || 'false' }}
        run: |
          set -euo pipefail
          [ "$HIST" = true ] || [ "$(date -u +%u)" = 7 ] || { echo "not Sunday: skipped"; exit 0; }
          mirror() { # <server dir under ~/bot/data> <Drive path>
            local src=$1 dst=$2 L="$RUNNER_TEMP/m-$(echo "$1" | tr / -)"
            ssh -n bot "cd ~/bot/data/$src 2>/dev/null && find . -type f -printf '%P\t%s\n'" | sort > "$L.server" || { echo "$src: not on the server"; return 0; }
            rclone lsf -R --files-only --format ps --separator $'\t' "$DRIVE_ROOT/$dst" 2>/dev/null | sort > "$L.drive" || true
            comm -23 "$L.server" "$L.drive" | cut -f1 > "$L.todo"
            echo "$src: $(wc -l < "$L.server") file(s) on the server, $(wc -l < "$L.todo") new or changed"
            [ -s "$L.todo" ] || return 0
            mkdir -p "$RUNNER_TEMP/m/$src"
            rsync -a --bwlimit=8000 --rsync-path="nice -n 19 rsync" --files-from="$L.todo" "bot:bot/data/$src/" "$RUNNER_TEMP/m/$src/" || [ $? -eq 24 ]
            rclone copy "$RUNNER_TEMP/m/$src" "$DRIVE_ROOT/$dst" --transfers 8
            rm -rf "$RUNNER_TEMP/m/$src"
          }
          mirror history raw/server-history
          mirror models/archive models/server/archive
          mirror models/work models/server/work
      - name: Drive totals
        if: always()
        run: |
          [ -f ~/.config/rclone/rclone.conf ] || exit 0
          for p in recordings audit paper raw simulated models lab-copies; do echo "$p: $(rclone size "$DRIVE_ROOT/$p" 2>/dev/null | tr '\n' ' ')"; done
          rclone about gdrive: 2>/dev/null | head -4 || true
