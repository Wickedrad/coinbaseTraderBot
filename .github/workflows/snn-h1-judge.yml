# Failure diagnosis SNN-H1-lead-info and H-B (shared mid lag): the judge over the per-row output the history-train
# arms keep on Drive (simulated/snn-rows/<arm args>/<run>/rows-*.jsonl.gz). Drive only; L1/L2 are never read.
name: snn-h1-judge
on:
  workflow_dispatch:
    inputs:
      arms:
        description: 'Comma list NAME:SEED=<folder under simulated/snn-rows>, e.g. C:11=lead-none_seed_11,G:11=lead_G_seed_11'
        required: true
      control:
        description: 'Arm name of the control'
        default: 'C'
      args:
        description: 'Extra judge args (e.g. --from 2026-08-07 --to 2026-11-04 --hb-from 2026-09-12 --max-spread 0.1)'
        default: ''
permissions:
  contents: read
jobs:
  judge:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - run: npm ci --no-audit --no-fund --silent
      - name: Judge
        env:
          ARMS: ${{ inputs.arms }}
          CTRL: ${{ inputs.control }}
          ARGS: ${{ inputs.args }}
        run: |
          set -euo pipefail
          mkdir -p research/out rows
          SPEC=""
          IFS=',' read -ra A <<< "$ARMS"
          for a in "${A[@]}"; do
            N="${a%%=*}"; F="${a#*=}"
            N=$(printf '%s' "$N" | tr -cd 'A-Za-z0-9:_-'); F=$(printf '%s' "$F" | tr -cd 'A-Za-z0-9._-')
            bash deploy/drive_lab.sh get "simulated/snn-rows/$F" "rows/$F" || { echo "::error::simulated/snn-rows/$F is not on Drive"; exit 1; }
            SPEC="$SPEC${SPEC:+,}$N=rows/$F"
          done
          EXTRA=$(printf '%s' "$ARGS" | tr -cd 'a-zA-Z0-9 .-')
          C=$(printf '%s' "$CTRL" | tr -cd 'A-Za-z0-9_-')
          NODE_OPTIONS="--max-old-space-size=12288" node --import tsx research/snnLeadJudge.ts --arms "$SPEC" --control "$C" --out research/out/snn-h1-judge.md $EXTRA | tail -120
          cat research/out/snn-h1-judge.md >> "$GITHUB_STEP_SUMMARY"
          bash deploy/drive_lab.sh put "derived/snn-h1-judge/${{ github.run_id }}" research/out
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snn-h1-judge
          path: research/out/snn-h1-judge.md
          if-no-files-found: ignore
