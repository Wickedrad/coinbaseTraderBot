# Untouched-levers lab (side mission thread). Lives only on its own branch: a push that changes the batch file starts it.
# Each job restores one replay-check copy from Drive once (reuse id per line, no server read at all), then replays its
# share of the batch four at a time on the runner's four cores (one replay = one core, ~1.7 GB), so three jobs run twelve
# arms at once inside the project's three-jobs-per-thread rationing. Every arm posts the replay check's own summary lines
# on the commit (REPLAY_TAG / REPLAY_NOTE in the header, as losses/lab/table.py reads them).
# The repository is public: only counts, dollars and setting names/values of the lever keys are printed, never the
# settings file, keys or logs.
# Batch lines: <tag> <day> <reuse run> <tick phase ms> <note> <overrides...>   (24 h stretch from <day> 15:40 UTC)
# Shards are contiguous blocks of about 8 lines (two waves of four, ~3.5-4 h on a B5 base), run three at a time in line
# order: put the control and placebo lines first so the first round already pairs.
name: Levers lab
on:
  push:
    branches: [claude/project-thread-6r3zml]
    paths: ['.github/levers-batch.txt']
permissions:
  contents: write
# Each batch push runs on its own (a later one no longer waits for, or replaces, a queued one): keep the jobs of all
# running batches within the thread's three with the batch file's "# max-parallel: N" line (default 3).
concurrency:
  group: levers-lab-${{ github.sha }}
  cancel-in-progress: false
jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.p.outputs.shards }}
      maxpar: ${{ steps.p.outputs.maxpar }}
    steps:
      - uses: actions/checkout@v5
      - id: p
        run: |
          n=$(grep -cvE '^[[:space:]]*(#|$)' .github/levers-batch.txt || true)
          s=$(( (n + 7) / 8 )); [ "$s" -lt 1 ] && s=1; [ "$s" -gt 10 ] && s=10
          echo "$n arm(s) in $s shard(s)"
          echo "shards=$(seq 0 $((s - 1)) | jq -cs .)" >> "$GITHUB_OUTPUT"
          mp=$(grep -oE '^# max-parallel: *[0-9]+' .github/levers-batch.txt | grep -oE '[0-9]+$' | head -1 || true)
          mp=${mp:-3}; [ "$mp" -lt 1 ] && mp=1; [ "$mp" -gt 10 ] && mp=10; echo "at most $mp job(s) at once"
          echo "maxpar=$mp" >> "$GITHUB_OUTPUT"
  arms:
    needs: plan
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJson(needs.plan.outputs.maxpar) }}
      matrix:
        shard: ${{ fromJson(needs.plan.outputs.shards) }}
    env:
      NSHARD: ${{ strategy.job-total }}
      SHARD: ${{ matrix.shard }}
      LANES: '4'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
      - name: Restore dependencies (node_modules + compiled TA-Lib)
        id: deps
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            vendor/talib/build
          key: train-deps-${{ runner.os }}-${{ hashFiles('package-lock.json', 'vendor/talib/**/*.c', 'vendor/talib/**/*.cpp', 'vendor/talib/**/*.h', 'vendor/talib/binding.gyp', 'vendor/talib/package.json') }}
      - name: Install dependencies
        if: steps.deps.outputs.cache-hit != 'true'
        run: npm ci --no-audit --no-fund --silent
      - name: This shard's arms
        run: |
          # Contiguous shards (lines s*k+1 .. s*k+k), so a batch ordered by priority (control, placebo, top arms first)
          # finishes whole comparisons in the first round instead of scattering them across every shard.
          grep -vE '^[[:space:]]*(#|$)' .github/levers-batch.txt > "$RUNNER_TEMP/all.txt"
          k=$(( ($(wc -l < "$RUNNER_TEMP/all.txt") + NSHARD - 1) / NSHARD ))
          awk -v k="$k" -v s="$SHARD" 'NR > s * k && NR <= (s + 1) * k' "$RUNNER_TEMP/all.txt" > "$RUNNER_TEMP/arms.txt"
          echo "shard $SHARD of $NSHARD: $(wc -l < "$RUNNER_TEMP/arms.txt") arm(s)"; cut -d' ' -f1 "$RUNNER_TEMP/arms.txt" | paste -sd' ' -
      - uses: ./.github/actions/drive-setup
        with:
          rclone_conf: ${{ secrets.RCLONE_CONF }}
      - name: Restore the copies the arms replay (Drive, no server read)
        run: |
          set -euo pipefail
          for reuse in $(awk '{print $3}' "$RUNNER_TEMP/arms.txt" | sort -u); do
            [[ "$reuse" =~ ^[0-9]+$ ]] || { echo "reuse must be a run id"; exit 1; }
            D="copies/$reuse"; mkdir -p "$D"
            rclone copy "gdrive:kalshi-bot-archive/lab-copies/kalshi-replay-check/$reuse" "$D" --transfers 4
            [ -s "$D/sweeps/check-days.txt" ] || { echo "::error::no copy of run $reuse on Drive"; exit 1; }
            # Only the days this shard's arms replay (each stretch is <day> 15:40 to the next day 15:40).
            NEED=$(awk -v r="$reuse" '$3 == r {print $2}' "$RUNNER_TEMP/arms.txt" | sort -u | while read -r x; do echo "$x"; date -u -d "$x +1 day" +%F; done | sort -u)
            for d in $(tr ',' ' ' < "$D/sweeps/check-days.txt"); do
              grep -qx "$d" "$RUNNER_TEMP/drive-days.txt" || continue
              echo "$NEED" | grep -qx "$d" || continue
              ls "$D"/recordings/md-$d.jsonl* >/dev/null 2>&1 || { rclone copy "gdrive:kalshi-bot-archive/recordings/md-$d.jsonl.gz" "$D/recordings/" && gzip -t "$D/recordings/md-$d.jsonl.gz"; }
              ls "$D"/audit/audit-$d* >/dev/null 2>&1 || rclone copy gdrive:kalshi-bot-archive/audit "$D/audit/" --include "audit-$d*" --transfers 4
            done
            echo "copy $reuse: $(du -sh "$D" | cut -f1), days $(cat "$D/sweeps/check-days.txt")"
          done
      - name: Replay the arms (four at a time)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -uo pipefail
          # Lever keys whose server values the comments may show (setting values only, no credentials).
          SHOW='^(VOL_FALLBACK_MULT|TA_VOL_WEIGHT|STRATEGY_[A-Z_]+|ACCURACY_GATE[A-Z_]*|SESSION_EDGE_[A-Z_]+|HOURLY_MID_BAND|PACER_[A-Z_]+|FILL_MIN_EV|VOL_SEASONALITY|HUNT_[A-Z_]+|RATCHET_[A-Z_]+|RISK_MAX_OPEN_ORDERS|TRIAL_PAPER_START|RULE_BOOK|EVAL_IDLE_SEC|STRATEGY_CADENCE)='
          cat > "$RUNNER_TEMP/arm.sh" <<'SH'
          #!/usr/bin/env bash
          # One arm: <tag> <day> <reuse> <phase> <note> <overrides...>
          set -uo pipefail
          read -r tag day reuse phase note ov <<< "$1"
          D="$GITHUB_WORKSPACE/copies/$reuse"; T="$RUNNER_TEMP/arm-$tag"; mkdir -p "$T"
          SEED=$( [ -s "$RUNNER_TEMP/seed-$reuse-$day.json" ] && sha256sum "$RUNNER_TEMP/seed-$reuse-$day.json" | cut -c1-8 || echo none)
          next=$(date -u -d "$day +1 day" +%F)
          (
            set -a; . "$D/sweep-env/train.env"; set +a
            for kv in $ov; do export "$kv"; done
            export DATA_DIR="$D" TRADING_MODE=paper REPLAY_TAG="$tag" REPLAY_NOTE="$note"
            P="$D/runner-temp"; BAL=$(cat "$P/paper-balance" 2>/dev/null || true); G="$P/paper-guard.json"; [ -s "$G" ] || G=""
            ARGS=(--recordings "$D/recordings" --audit "$D/audit" --days "$day,$next" --from "${day}T15:40:00Z" --to "${next}T15:40:00Z" --min-hours 3
              ${BAL:+--paper-balance-now "$BAL"} ${G:+--paper-guard "$G"} --kill-override "$(cat "$P/kill-override" 2>/dev/null || echo true)"
              --maker-markouts "$P/maker-markouts.json" --paper-probation "$P/paper-probation.json" --paper-trials "$P/paper-trials.json"
              --paper-tp-bench "$P/paper-tp-bench.json" --paper-accuracy-gate "$P/paper-accuracy-gate.json" --paper-trades "$P/paper-trades.jsonl" --model "$D/models/model.json")
            S="$RUNNER_TEMP/seed-$reuse-$day.json"; [ -s "$S" ] && ARGS+=(--seed-candles "$S")
            # Stop 5 min after the stretch (every market closing inside it has settled; the verdict is unchanged) instead of
            # simulating the next day file to midnight (~8 h of US session, ~1/5 of the replay). RS_STOP_AFTER_MIN=off: full.
            STOP="${RS_STOP_AFTER_MIN-5}"; [ "$STOP" = off ] || ARGS+=(--stop-after-min "$STOP")
            # Batched recording reader (same events, order and ties; ~1 us a line less). RS_READER=classic: the per-line one.
            [ "${RS_READER-batched}" = classic ] || ARGS+=(--batched-reader)
            T0=$(date +%s)
            timeout 170m node --import tsx research/replayCheck.ts "${ARGS[@]}" --tick-phase-ms "$phase" --out "$T/out.json" || echo "replay failed or cut off"
            echo "arm took $(( ($(date +%s) - T0) / 60 )) min"
          ) > "$T/own.log" 2>&1
          { echo "**Levers lab** run [$GITHUB_RUN_ID]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID) · from ${day}T15:40:00Z · replay-only overrides: \`REPLAY_TAG=$tag $ov REPLAY_NOTE=$note\` · tick phase $phase ms · seed $SEED"
            echo; echo '```'; grep -vE ' (WARN|INFO|DEBUG) +\[' "$T/own.log" | cut -c1-1500 | head -n 130; echo '```'
            echo; echo 'lever settings in force (server values, then the arm'"'"'s):'; echo '```'
            grep -E "$SHOW" "$D/sweep-env/train.env" | cut -c1-120 | paste -sd' ' -; echo "arm: $ov"; echo '```'; } > "$T/comment.md"
          for i in 1 2 3; do
            jq -n --rawfile body "$T/comment.md" '{body: $body}' | gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/comments" --input - --jq '.html_url' && break
            sleep $((i * 20))
          done
          echo "$tag: $(grep -E '^replay +fills' "$T/own.log" | head -1 | cut -c1-160)"
          SH
          chmod +x "$RUNNER_TEMP/arm.sh"; export SHOW
          # The spot candles the bot held at each stretch's start (Coinbase): fetched once per copy and day and kept on Drive
          # with the copy, so every shard and later batch replays from the same candles (the comment shows their hash).
          for k in $(awk '{print $3 "|" $2}' "$RUNNER_TEMP/arms.txt" | sort -u); do
            reuse=${k%|*}; day=${k#*|}; next=$(date -u -d "$day +1 day" +%F); D="copies/$reuse"; S="$RUNNER_TEMP/seed-$reuse-$day.json"
            if [ -s "$D/seeds/seed-$day.json" ]; then cp "$D/seeds/seed-$day.json" "$S"; how='from Drive'
            else
              ( set -a; . "$D/sweep-env/train.env"; set +a; export DATA_DIR="$GITHUB_WORKSPACE/$D" TRADING_MODE=paper
                node --import tsx research/replayCheck.ts --recordings "$D/recordings" --audit "$D/audit" --days "$day,$next" --from "${day}T15:40:00Z" --to "${next}T15:40:00Z" \
                  --model "$D/models/model.json" --fetch-seed "$S" > /dev/null 2>&1 ) || true
              how='not fetched (recorded bars only)'
              if [ -s "$S" ]; then how=fetched; rclone copyto "$S" "gdrive:kalshi-bot-archive/lab-copies/kalshi-replay-check/$reuse/seeds/seed-$day.json" && how='fetched, kept on Drive'; fi
            fi
            echo "seed candles $day: $how $([ -s "$S" ] && sha256sum "$S" | cut -c1-8)"
          done
          T0=$(date +%s)
          tr '\n' '\0' < "$RUNNER_TEMP/arms.txt" | xargs -0 -P "$LANES" -I{} "$RUNNER_TEMP/arm.sh" {}
          echo "shard took $(( ($(date +%s) - T0) / 60 )) min; memory now $(free -m | awk '/^Mem:/ {print $3 " MB used of " $2}')"
