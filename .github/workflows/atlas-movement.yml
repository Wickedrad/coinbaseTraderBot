name: Opportunity Atlas advance movement (GitHub only)

on:
  workflow_dispatch:
    inputs:
      source_run:
        description: 'Completed observed-recording study containing base/S5/S6 input receipts; consumes no settlement outcomes'
        default: '42568366333'
        required: true

permissions:
  contents: read
  actions: read

jobs:
  movement-study:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: atlas-recording-study
          path: ${{ runner.temp }}/atlas-movement-source
          github-token: ${{ github.token }}
          run-id: ${{ inputs.source_run }}
      - name: Register, label and fit advance movement independently of settlement
        run: |
          npm run research:opportunity-movement -- run --source "$RUNNER_TEMP/atlas-movement-source" \
            --out research/out/atlas-movement-study
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: atlas-movement-study
          path: research/out/atlas-movement-study/
          if-no-files-found: warn
          retention-days: 90
