name: Drive setup
description: Installs rclone with the Drive archive's token (remote "gdrive", scope drive.file) and lists the archived days in $RUNNER_TEMP/drive-days.txt
inputs:
  rclone_conf:
    description: The RCLONE_CONF secret
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        RCLONE_CONF: ${{ inputs.rclone_conf }}
      run: |
        set -euo pipefail
        if [ -z "$RCLONE_CONF" ]; then echo "::error::RCLONE_CONF secret is not set (see drive-archive.yml)"; exit 1; fi
        # apt first (one bounded try). When the runner cannot reach the Ubuntu mirrors, the same rclone version
        # (1.60.1) from rclone's release page, checked against a pinned SHA-256 before it is installed.
        if ! command -v rclone >/dev/null; then
          if ! sudo timeout 120 apt-get install -y -qq rclone >/dev/null; then
            echo "::warning::apt could not install rclone; using the pinned release file"
            V=v1.60.1; SUM=1c89af499e9d81c3ee2af8fa74a88414c22657c3df439f4d812e803bff5671cd
            curl -fsSL --retry 3 --retry-delay 5 --max-time 300 -o "$RUNNER_TEMP/rclone.deb" "https://github.com/rclone/rclone/releases/download/$V/rclone-$V-linux-amd64.deb"
            echo "$SUM  $RUNNER_TEMP/rclone.deb" | sha256sum -c --status - || { echo "::error::the rclone release file does not match the pinned hash"; exit 1; }
            sudo dpkg -i "$RUNNER_TEMP/rclone.deb" >/dev/null
          fi
          command -v rclone >/dev/null || { echo "::error::could not install rclone"; exit 1; }
        fi
        mkdir -p ~/.config/rclone
        printf '%s\n' "$RCLONE_CONF" > ~/.config/rclone/rclone.conf && chmod 600 ~/.config/rclone/rclone.conf
        bash deploy/drive_lab.sh days > "$RUNNER_TEMP/drive-days.txt"
        echo "Drive has $(wc -l < "$RUNNER_TEMP/drive-days.txt") archived day(s): $(paste -sd, "$RUNNER_TEMP/drive-days.txt")"
